                    <th className="py-3 px-3 text-right cursor-pointer hover:text-white" onClick={() => handleSort('mcxMTM')}>M MTM <SortIcon columnKey="mcxMTM"/></th>
                    <th className="py-3 px-3 text-right cursor-pointer hover:text-white" onClick={() => handleSort('mcxRealized')}>M Realized <SortIcon columnKey="mcxRealized"/></th>
                    <th className="py-3 px-3 text-right cursor-pointer hover:text-white" onClick={() => handleSort('totalRealized')}>Total Realized <SortIcon columnKey="totalRealized"/></th>
                    <th className="py-3 px-4 cursor-pointer hover:text-white" onClick={() => handleSort('remark')}>Status &amp; Rollover <SortIcon columnKey="remark"/></th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-[#182543] font-mono">
                  {sorted.map(r => {
                    const isExpanded = expandedLots.has(r.lot); const allLegs = [...r.lme.promptLegs, ...r.mcx.promptLegs];
                    return (
                      <React.Fragment key={r.lot}>
                        <tr onClick={() => onSelectLot(r.lot)} className="hover:bg-[#16223d]/70 transition-colors cursor-pointer group">
                          <td className="py-3 px-3 font-bold text-white whitespace-nowrap"><div className="flex items-center gap-1.5">{allLegs.length > 1 && (<button onClick={e => toggleExpand(r.lot, e)} className="p-0.5 rounded hover:bg-slate-700 text-slate-400">{isExpanded ? <ChevronDown className="w-3.5 h-3.5 text-blue-400" /> : <ChevronRight className="w-3.5 h-3.5" />}</button>)}<span className="group-hover:text-blue-400">{r.lot}</span></div></td>
                          <td className="py-3 px-3 font-sans"><span className="px-2 py-0.5 rounded text-[11px] bg-blue-500/10 text-blue-300 border border-blue-500/20">{shortMetal(r.metal)}</span></td>
                          <td className="py-3 px-3 text-right whitespace-nowrap" onClick={e => e.stopPropagation()}><input type="number" step="any" value={r.fxRate} onChange={e => { const val = parseFloat(e.target.value); if (!isNaN(val) && val > 0) onUpdateLotFx(r.lot, val); }} title={`Edit USDINR FX rate for Lot ${r.lot}`} className="w-20 px-2 py-1 text-right bg-[#0b1220] border border-blue-500/40 rounded-lg text-xs font-mono font-bold text-cyan-300 focus:outline-none focus:border-blue-400" /></td>
                          <td className="py-3 px-3 font-bold text-slate-200 whitespace-nowrap">{r.lme.activePrompt ? fmtD(r.lme.activePrompt) : '—'}</td><td className={`py-3 px-3 text-right font-bold ${pnlClass(r.lme.netQty)}`}>{fmt(r.lme.netQty, 2)}</td><td className="py-3 px-3 text-right text-slate-300">{r.lme.settle ? fmt(r.lme.settle) : '—'}</td><td className={`py-3 px-3 text-right font-bold ${pnlClass(r.lme.mtm)}`}>{fmt(r.lme.mtm)}</td><td className={`py-3 px-3 text-right font-bold ${pnlClass(r.lme.realized)}`}>{fmt(r.lme.realized)}</td>
                          <td className="py-3 px-3 text-slate-300">{r.mcx.activePrompt ? fmtD(r.mcx.activePrompt) : '—'}</td><td className={`py-3 px-3 text-right font-bold ${pnlClass(r.mcx.netQty)}`}>{fmt(r.mcx.netQty, 2)}</td><td className={`py-3 px-3 text-right font-bold ${pnlClass(r.mcx.mtm)}`}>{fmt(r.mcx.mtm)}</td><td className={`py-3 px-3 text-right font-bold ${pnlClass(r.mcx.realized)}`}>{fmt(r.mcx.realized)}</td><td className={`py-3 px-3 text-right font-bold ${pnlClass(r.totalRealized)}`}>{fmt(r.totalRealized)}</td>
                          <td className="py-3 px-4 font-sans whitespace-nowrap"><span className={`px-2 py-0.5 rounded-full text-[10px] font-semibold ${r.remark === 'Hedge Active' ? 'bg-amber-500/15 text-amber-300 border border-amber-500/30' : 'bg-emerald-500/15 text-emerald-300 border border-emerald-500/30'}`}>{r.remark}</span></td>
                        </tr>
                      </React.Fragment>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    };

    const PhysicalEntry = ({ buys, sells, onAddBuy, onAddSell, onDeleteBuy, onDeleteSell, setEditingPhysical }) => {
      const [buyLot, setBuyLot] = useState(''); const [buyCat, setBuyCat] = useState(''); const [buyMetal, setBuyMetal] = useState('AL'); const [buyExch, setBuyExch] = useState('LME'); const [buyDate, setBuyDate] = useState(new Date().toISOString().slice(0, 10)); const [buyQty, setBuyQty] = useState(''); const [buyCsp, setBuyCsp] = useState(''); const [buyPrem, setBuyPrem] = useState('0'); const [buyUsd, setBuyUsd] = useState('84.2');
      const [buyFileName, setBuyFileName] = useState('No File'); const [buyFileData, setBuyFileData] = useState(null);
      const [sellLot, setSellLot] = useState(''); const [sellCat, setSellCat] = useState(''); const [sellDate, setSellDate] = useState(new Date().toISOString().slice(0, 10)); const [sellQty, setSellQty] = useState(''); const [sellPrice, setSellPrice] = useState('');
      const duty = getDuty(buyMetal);
      
      const calculateLanded = () => { 
        if (buyExch === 'MCX') {
          const basePriceKg = parseFloat(buyCsp) || 0;
          const premKg = parseFloat(buyPrem) || 0;
          // Multiply by 1000 to convert ₹/kg to ₹/MT
          return (basePriceKg + premKg) * 1000;
        }
        const csp = parseFloat(buyCsp) || 0; 
        const prem = parseFloat(buyPrem) || 0; 
        const usd = parseFloat(buyUsd) || 1; 
        return (csp + prem) * usd * (1 + duty / 100); 
      };

      const handleFileChange = (e) => {
        const file = e.target.files?.[0];
        if (file) {
          setBuyFileName(file.name);
          const reader = new FileReader();
          reader.onloadend = () => {
            if (file.type.startsWith('image/')) {
              const img = new Image();
              img.onload = () => {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 600; 
                const scaleSize = MAX_WIDTH / img.width;
                canvas.width = MAX_WIDTH; canvas.height = img.height * scaleSize;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                setBuyFileData(canvas.toDataURL('image/jpeg', 0.6));
              };
              img.src = reader.result;
            } else {
              setBuyFileData(reader.result);
            }
          };
          reader.readAsDataURL(file);
        } else {
          setBuyFileName('No File'); setBuyFileData(null);
        }
      };

      const handleSaveBuy = (e) => { e.preventDefault(); if (!buyLot.trim()) return; const qty = parseFloat(buyQty) || 0; if (qty <= 0) return; const landed = calculateLanded(); onAddBuy({ id: `buy-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`, lot: buyLot.trim().toUpperCase(), cat: buyCat.trim(), metal: buyMetal, exch: buyExch, date: buyDate, qty, csp: parseFloat(buyCsp) || 0, prem: parseFloat(buyPrem) || 0, usd: parseFloat(buyUsd) || 1, duty, landed, file: buyFileName, fileData: buyFileData }); setBuyLot(''); setBuyQty(''); setBuyCsp(''); setBuyFileName('No File'); setBuyFileData(null); };
      const handleSaveSell = (e) => { e.preventDefault(); if (!sellLot.trim()) return; const qty = parseFloat(sellQty) || 0; const price = parseFloat(sellPrice) || 0; if (qty <= 0 || price <= 0) return; onAddSell({ id: `sell-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`, lot: sellLot.trim().toUpperCase(), cat: sellCat.trim(), date: sellDate, qty, price }); setSellLot(''); setSellQty(''); setSellPrice(''); };
      
      const handleSalesFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const wb = XLSX.read(ev.target?.result, { type: 'array' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(ws, { defval: '' });
            const newSells = [];
            json.forEach((row, idx) => {
              const lot = String(row['Lot ID'] || row['lot'] || '').trim().toUpperCase();
              if (!lot) return;
              newSells.push({
                id: `sell-excel-${Date.now()}-${idx}`,
                lot: lot,
                cat: String(row['Buyer'] || row['buyer'] || row['CAT'] || '').trim(),
                date: parsePromptString(row['Date'] || row['date']) || new Date().toISOString().slice(0, 10),
                qty: parseFloat(row['Qty'] || row['qty'] || row['Sold Qty'] || 0) || 0,
                price: parseFloat(row['Price'] || row['price'] || row['Sell Price'] || 0) || 0
              });
            });
            if (newSells.length > 0) {
              newSells.forEach(s => onAddSell(s));
              alert(`Successfully imported ${newSells.length} sales!`);
            } else {
              alert("No valid rows found. Please use the template.");
            }
          } catch (err) {
            console.error(err);
            alert("Error parsing Excel file.");
          }
        };
        reader.readAsArrayBuffer(file);
        e.target.value = '';
      };

      const downloadSalesTemplate = () => {
        const sampleRows = [{ 'Lot ID': 'AL1', 'Buyer': 'Apex Extrusions', 'Date': '2026-10-25', 'Qty': 50, 'Price': 245000 }];
        const ws = XLSX.utils.json_to_sheet(sampleRows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Sales');
        XLSX.writeFile(wb, 'Physical_Sales_Template.xlsx');
      };

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="bg-gradient-to-b from-[#111c33] to-[#16223d] border border-[#1e2d4d] rounded-2xl p-5 shadow-xl">
              <h3 className="text-sm font-bold uppercase tracking-wider text-blue-400 mb-4 flex items-center gap-2"><PlusCircle className="w-4 h-4" /><span>Add Metal Physical Purchase</span></h3>
              <form onSubmit={handleSaveBuy} className="space-y-4">
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                  <div><label className="block text-[11px] font-semibold uppercase text-slate-400 mb-1">Lot ID *</label><input type="text" placeholder="e.g. AL1" value={buyLot} onChange={e => setBuyLot(e.target.value.toUpperCase())} className="w-full bg-[#0b1220] border border-[#1e2d4d] rounded-xl px-3 py-2 text-xs text-slate-100 font-mono font-bold uppercase" required /></div>
                  <div><label className="block text-[11px] font-semibold uppercase text-slate-400 mb-1">Supplier / CAT</label><input type="text" placeholder="Supplier name" value={buyCat} onChange={e => setBuyCat(e.target.value)} className="w-full bg-[#0b1220] border border-[#1e2d4d] rounded-xl px-3 py-2 text-xs text-slate-100" /></div>
                  <div><label className="block text-[11px] font-semibold uppercase text-slate-400 mb-1">Metal</label><select value={buyMetal} onChange={e => setBuyMetal(e.target.value)} className="w-full bg-[#0b1220] border border-[#1e2d4d] rounded-xl px-3 py-2 text-xs text-slate-100"><option value="AL">Aluminium (AL)</option><option value="ZN">Zinc (ZN)</option><option value="CU">Copper (CU)</option><option value="PB">Lead (PB)</option></select></div>
                  <div><label className="block text-[11px] font-semibold uppercase text-slate-400 mb-1">Pricing Basis</label><select value={buyExch} onChange={e => setBuyExch(e.target.value)} className="w-full bg-[#0b1220] border border-[#1e2d4d] rounded-xl px-3 py-2 text-xs text-slate-100"><option value="LME">LME Import Formula</option><option value="MCX">Direct INR Landed</option></select></div>
                  <div><label className="block text-[11px] font-semibold uppercase text-slate-400 mb-1">Buy Date</label><input type="date" value={buyDate} onChange={e => setBuyDate(e.target.value)} className="w-full bg-[#0b1220] border border-[#1e2d4d] rounded-xl px-3 py-2 text-xs text-slate-100 font-mono" /></div>
                  <div><label className="block text-[11px] font-semibold uppercase text-slate-400 mb-1">Buy Qty (MT) *</label><input type="number" step="any" placeholder="0.00" value={buyQty} onChange={e => setBuyQty(e.target.value)} className="w-full bg-[#0b1220] border border-[#1e2d4d] rounded-xl px-3 py-2 text-xs text-slate-100 font-mono font-bold" required /></div>
                  
                  <div><label className="block text-[11px] font-semibold uppercase text-slate-400 mb-1">{buyExch === 'LME' ? 'CSP ($ / MT)' : 'Base MCX Price (₹/KG)'}</label><input type="number" step="any" placeholder="0.00" value={buyCsp} onChange={e => setBuyCsp(e.target.value)} className="w-full bg-[#0b1220] border border-[#1e2d4d] rounded-xl px-3 py-2 text-xs text-slate-100 font-mono" /></div>
                  <div><label className="block text-[11px] font-semibold uppercase text-slate-400 mb-1">{buyExch === 'LME' ? 'Premium ($)' : 'Premium / Disc (₹/KG)'}</label><input type="number" step="any" value={buyPrem} onChange={e => setBuyPrem(e.target.value)} className="w-full bg-[#0b1220] border border-[#1e2d4d] rounded-xl px-3 py-2 text-xs text-slate-100 font-mono" /></div>

                  {buyExch === 'LME' && (<div><label className="block text-[11px] font-semibold uppercase text-slate-400 mb-1">USDINR</label><input type="number" step="any" value={buyUsd} onChange={e => setBuyUsd(e.target.value)} className="w-full bg-[#0b1220] border border-[#1e2d4d] rounded-xl px-3 py-2 text-xs text-slate-100 font-mono" /></div>)}
                  
                  <div className="col-span-2 sm:col-span-3"><label className="block text-[11px] font-semibold uppercase text-slate-400 mb-1">Upload Purchase Agreement (Image / PDF)</label><input type="file" accept=".pdf,.doc,.docx,image/*" onChange={handleFileChange} className="w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-[11px] file:font-semibold file:bg-[#16223d] file:text-blue-300 hover:file:bg-[#1e2d4d] cursor-pointer border border-[#1e2d4d] rounded-xl bg-[#0b1220] py-1.5" /></div>
                </div>
                <div className="p-3 bg-black/20 rounded-xl border border-slate-800 flex items-center justify-between text-xs"><span className="text-slate-400">Effective Landed Cost:</span><span className="font-mono font-bold text-sm text-emerald-400">₹{fmt(calculateLanded(), 2)} / MT</span></div>
                <button type="submit" className="w-full py-2.5 rounded-xl text-xs font-semibold bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-md cursor-pointer">Save Physical Purchase Record</button>
              </form>
            </div>
            <div className="bg-gradient-to-b from-[#111c33] to-[#16223d] border border-[#1e2d4d] rounded-2xl p-5 shadow-xl flex flex-col justify-between">
              <div>
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-sm font-bold uppercase tracking-wider text-emerald-400 flex items-center gap-2"><PlusCircle className="w-4 h-4" /><span>Add Metal Physical Sale</span></h3>
                  <div className="flex gap-2">
                    <button onClick={downloadSalesTemplate} className="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-[#16223d] hover:bg-[#1e2d4d] text-cyan-300 border border-cyan-500/30 cursor-pointer">
                      <Download className="w-3 h-3" /><span>Template</span>
                    </button>
                    <label className="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-blue-600 hover:bg-blue-500 text-white cursor-pointer">
                      <Upload className="w-3 h-3" />
                      <span>Upload Excel</span>
                      <input type="file" accept=".xlsx,.xls" onChange={handleSalesFileUpload} className="hidden" />
                    </label>
                  </div>
                </div>
                <form onSubmit={handleSaveSell} className="space-y-4">
                  <div className="grid grid-cols-2 gap-3">
                    <div><label className="block text-[11px] font-semibold uppercase text-slate-400 mb-1">Lot ID *</label><input type="text" placeholder="e.g. AL1" value={sellLot} onChange={e => setSellLot(e.target.value.toUpperCase())} className="w-full bg-[#0b1220] border border-[#1e2d4d] rounded-xl px-3 py-2 text-xs text-slate-100 font-mono font-bold uppercase" required /></div>
                    <div><label className="block text-[11px] font-semibold uppercase text-slate-400 mb-1">Buyer / CAT</label><input type="text" placeholder="Buyer name" value={sellCat} onChange={e => setSellCat(e.target.value)} className="w-full bg-[#0b1220] border border-[#1e2d4d] rounded-xl px-3 py-2 text-xs text-slate-100" /></div>
                    <div><label className="block text-[11px] font-semibold uppercase text-slate-400 mb-1">Sale Date</label><input type="date" value={sellDate} onChange={e => setSellDate(e.target.value)} className="w-full bg-[#0b1220] border border-[#1e2d4d] rounded-xl px-3 py-2 text-xs text-slate-100 font-mono" /></div>
                    <div><label className="block text-[11px] font-semibold uppercase text-slate-400 mb-1">Sold Qty (MT) *</label><input type="number" step="any" placeholder="0.00" value={sellQty} onChange={e => setSellQty(e.target.value)} className="w-full bg-[#0b1220] border border-[#1e2d4d] rounded-xl px-3 py-2 text-xs text-slate-100 font-mono font-bold" required /></div>
                    <div className="col-span-2"><label className="block text-[11px] font-semibold uppercase text-slate-400 mb-1">Sell Price (₹ / MT) *</label><input type="number" step="any" placeholder="0.00" value={sellPrice} onChange={e => setSellPrice(e.target.value)} className="w-full bg-[#0b1220] border border-[#1e2d4d] rounded-xl px-3 py-2 text-xs text-slate-100 font-mono font-bold" required /></div>
                  </div>
                  <button type="submit" className="w-full py-2.5 rounded-xl text-xs font-semibold bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-md cursor-pointer">Save Physical Sale Record</button>
                </form>
              </div>
            </div>
          </div>
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="bg-[#111c33] border border-[#1e2d4d] rounded-2xl shadow-xl overflow-hidden">
              <div className="px-5 py-3 border-b border-[#1e2d4d] bg-[#16223d]"><h4 className="text-xs font-bold uppercase text-slate-300">Physical Purchases Log ({buys.length})</h4></div>
              <div className="overflow-x-auto max-h-80">
                <table className="w-full text-xs text-left">
                  <thead><tr className="bg-[#16223d] text-slate-400 text-[10.5px] uppercase font-semibold"><th className="py-2.5 px-3">Lot ID</th><th className="py-2.5 px-2">Supplier</th><th className="py-2.5 px-2">Metal</th><th className="py-2.5 px-2">Date</th><th className="py-2.5 px-2 text-right">Qty (MT)</th><th className="py-2.5 px-2 text-right">Landed Price</th><th className="py-2.5 px-2 text-center">Doc</th><th className="py-2.5 px-3 text-center">Actions</th></tr></thead>
                  <tbody className="divide-y divide-[#182543] font-mono">
                    {buys.map(b => (<tr key={b.id} className="hover:bg-[#16223d]/50"><td className="py-2 px-3 font-bold text-white">{b.lot}</td><td className="py-2 px-2 font-sans text-slate-300 truncate max-w-[120px]" title={b.cat}>{b.cat || '—'}</td><td className="py-2 px-2 font-sans">{shortMetal(b.metal)}</td><td className="py-2 px-2 text-slate-400">{fmtD(b.date)}</td><td className="py-2 px-2 text-right">{fmt(b.qty, 2)}</td><td className="py-2 px-2 text-right">₹{fmt(b.landed, 2)}</td><td className="py-2 px-2 text-center">{b.fileData ? (<a href={b.fileData} target="_blank" rel="noopener noreferrer" title={`View ${b.file}`} className="text-emerald-400 hover:text-emerald-300"><FileText className="w-3.5 h-3.5 inline" /></a>) : (<span title={b.file || "No Document"} className="text-slate-600"><FileText className="w-3.5 h-3.5 inline" /></span>)}</td><td className="py-2 px-3 text-center"><div className="flex items-center justify-center gap-2"><button onClick={() => setEditingPhysical({ type: 'buy', data: b })} className="text-blue-400 hover:text-blue-300 p-1 cursor-pointer" title="Edit"><Edit className="w-3.5 h-3.5" /></button><button onClick={() => onDeleteBuy(b.id)} className="text-rose-400 hover:text-rose-300 p-1 cursor-pointer" title="Delete"><Trash2 className="w-3.5 h-3.5" /></button></div></td></tr>))}
                  </tbody>
                </table>
              </div>
            </div>
            <div className="bg-[#111c33] border border-[#1e2d4d] rounded-2xl shadow-xl overflow-hidden">
              <div className="px-5 py-3 border-b border-[#1e2d4d] bg-[#16223d]"><h4 className="text-xs font-bold uppercase text-slate-300">Physical Sales Log ({sells.length})</h4></div>
              <div className="overflow-x-auto max-h-80">
                <table className="w-full text-xs text-left">
                  <thead><tr className="bg-[#16223d] text-slate-400 text-[10.5px] uppercase font-semibold"><th className="py-2.5 px-3">Lot ID</th><th className="py-2.5 px-2">Buyer</th><th className="py-2.5 px-2">Date</th><th className="py-2.5 px-2 text-right">Sold Qty (MT)</th><th className="py-2.5 px-2 text-right">Sell Price</th><th className="py-2.5 px-3 text-center">Actions</th></tr></thead>
                  <tbody className="divide-y divide-[#182543] font-mono">
                    {sells.map(s => (<tr key={s.id} className="hover:bg-[#16223d]/50"><td className="py-2 px-3 font-bold text-white">{s.lot}</td><td className="py-2 px-2 font-sans text-slate-300">{s.cat || '—'}</td><td className="py-2 px-2 text-slate-400">{fmtD(s.date)}</td><td className="py-2 px-2 text-right">{fmt(s.qty, 2)}</td><td className="py-2 px-2 text-right">₹{fmt(s.price, 2)}</td><td className="py-2 px-3 text-center"><div className="flex items-center justify-center gap-2"><button onClick={() => setEditingPhysical({ type: 'sell', data: s })} className="text-blue-400 hover:text-blue-300 p-1 cursor-pointer" title="Edit"><Edit className="w-3.5 h-3.5" /></button><button onClick={() => onDeleteSell(s.id)} className="text-rose-400 hover:text-rose-300 p-1 cursor-pointer" title="Delete"><Trash2 className="w-3.5 h-3.5" /></button></div></td></tr>))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      );

                <select value={brokerFilter} onChange={e => setBrokerFilter(e.target.value)} className="bg-[#0b1220] border border-[#1e2d4d] rounded-xl px-2.5 py-1.5 text-xs text-slate-300"><option value="">All Brokers</option><option value="MOTILAL">Motilal</option><option value="IIFL">IIFL</option><option value="LME">LME Broker</option></select>
                <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} className="bg-[#0b1220] border border-[#1e2d4d] rounded-xl px-2.5 py-1.5 text-xs text-slate-300"><option value="">All Status</option><option value="UNMAPPED">Unmapped Only</option><option value="MAPPED">Mapped Only</option></select>
              </div>
            </div>
            <div className="border border-[#1e2d4d] rounded-xl overflow-x-auto max-h-[60vh] bg-[#0b1220]">
              <table className="w-full text-xs text-left">
                <thead><tr className="bg-[#16223d] text-slate-400 uppercase text-[10.5px] font-semibold sticky top-0 z-10 border-b border-[#1e2d4d]"><th className="py-2.5 px-3">Trade ID</th><th className="py-2.5 px-2">Exch / Broker</th><th className="py-2.5 px-2">Metal</th><th className="py-2.5 px-3">Trade Date</th><th className="py-2.5 px-3">Prompt / Expiry</th><th className="py-2.5 px-2 text-right">Buy Lots (MT)</th><th className="py-2.5 px-2 text-right">Buy Rate</th><th className="py-2.5 px-2 text-right">Sell Lots (MT)</th><th className="py-2.5 px-2 text-right">Sell Rate</th><th className="py-2.5 px-3">Assigned Lot ID</th><th className="py-2.5 px-2 text-center">Actions</th></tr></thead>
                <tbody className="divide-y divide-[#182543] font-mono">
                  {visibleTrades.map(h => {
                    const mul = getLotMultiplier(h.exch, h.metal); const buyMT = nz(h.buyQty) * mul; const sellMT = nz(h.sellQty) * mul;
                    return (
                      <tr key={h.id} className="hover:bg-[#16223d]/60 transition-colors">
                        <td className="py-2 px-3 font-semibold text-slate-200">{h.tradeId}</td>
                        <td className="py-2 px-2 font-sans whitespace-nowrap"><div className="flex items-center gap-1"><span className={`px-1.5 py-0.5 rounded text-[10px] font-bold ${h.exch === 'MCX' ? 'bg-amber-500/15 text-amber-300 border border-amber-500/30' : 'bg-indigo-500/15 text-indigo-300 border border-indigo-500/30'}`}>{h.exch}</span>{h.broker && h.broker !== h.exch && (<span className={`px-1.5 py-0.5 rounded text-[10px] font-semibold ${h.broker.includes('MOTILAL') ? 'bg-orange-500/15 text-orange-300' : h.broker.includes('IIFL') ? 'bg-cyan-500/15 text-cyan-300' : 'bg-slate-800 text-slate-300'}`}>{h.broker}</span>)}</div></td>
                        <td className="py-2 px-2 font-sans font-semibold text-blue-300">{shortMetal(h.metal)}</td>
                        <td className="py-2 px-3 text-slate-300 whitespace-nowrap">{fmtD(h.date)}</td>
                        <td className="py-2 px-3 font-bold text-white whitespace-nowrap"><span>{h.prompt || '—'}</span>{h.expiryLabel && (<span className="ml-1.5 px-1.5 py-0.2 rounded text-[10px] bg-slate-800 text-slate-400 font-sans">{h.expiryLabel}</span>)}</td>
                        <td className="py-2 px-2 text-right text-slate-300">{h.buyQty > 0 ? (<span>{fmt(h.buyQty, 2)} <span className="text-[10px] text-slate-500">({fmt(buyMT, 1)}MT)</span></span>) : '—'}</td>
                        <td className="py-2 px-2 text-right text-slate-300">{h.buyRate > 0 ? (h.exch === 'MCX' ? `₹${fmt(h.buyRate, 2)}` : `$${fmt(h.buyRate, 2)}`) : '—'}</td>
                        <td className="py-2 px-2 text-right text-slate-300">{h.sellQty > 0 ? (<span>{fmt(h.sellQty, 2)} <span className="text-[10px] text-slate-500">({fmt(sellMT, 1)}MT)</span></span>) : '—'}</td>
                        <td className="py-2 px-2 text-right text-slate-300">{h.sellRate > 0 ? (h.exch === 'MCX' ? `₹${fmt(h.sellRate, 2)}` : `$${fmt(h.sellRate, 2)}`) : '—'}</td>
                        <td className="py-2 px-3"><input type="text" placeholder="Assign Lot" value={h.mappedLot} onChange={e => onUpdateHedgeTrade(h.id, { mappedLot: e.target.value.toUpperCase() })} className={`w-28 px-2 py-1 rounded text-xs font-mono font-bold uppercase focus:outline-none ${h.mappedLot ? 'bg-[#111c33] border border-blue-500/40 text-blue-300' : 'bg-amber-950/20 border border-amber-500/40 text-amber-300'}`} /></td>
                        <td className="py-2 px-2 text-center"><div className="flex items-center justify-center gap-2"><button onClick={() => setEditingHedge(h)} className="text-blue-400 hover:text-blue-300 p-1 cursor-pointer" title="Edit Trade"><Edit className="w-3.5 h-3.5" /></button><button onClick={() => onDeleteHedgeTrade(h.id)} className="text-rose-400 hover:text-rose-300 p-1 cursor-pointer" title="Delete"><Trash2 className="w-3.5 h-3.5" /></button></div></td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    };

    // ==================== EDIT MODALS ====================
    const EditPhysicalModal = ({ editing, onClose, onSave }) => {
      const [formData, setFormData] = useState(editing.data);
      if (!editing) return null;
      const isBuy = editing.type === 'buy';
      
      const handleChange = (e) => setFormData({ ...formData, [e.target.name]: e.target.value });
      
      const handleFileChange = (e) => {
        const file = e.target.files?.[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            if (file.type.startsWith('image/')) {
              const img = new Image();
              img.onload = () => {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 600; 
                const scaleSize = MAX_WIDTH / img.width;
                canvas.width = MAX_WIDTH; canvas.height = img.height * scaleSize;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                setFormData({ ...formData, file: file.name, fileData: canvas.toDataURL('image/jpeg', 0.6) });
              };
              img.src = reader.result;
            } else {
              setFormData({ ...formData, file: file.name, fileData: reader.result });
            }
          };
          reader.readAsDataURL(file);
        } else {
          setFormData({ ...formData, file: 'No File', fileData: null });
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
          <div className="bg-[#111c33] border border-[#1e2d4d] rounded-2xl p-6 w-full max-w-md shadow-2xl space-y-4">
            <h3 className="text-sm font-bold text-white">Edit {isBuy ? 'Physical Purchase' : 'Physical Sale'} (Lot {formData.lot})</h3>
            <div className="grid grid-cols-2 gap-3 text-xs">
              <div><label className="text-slate-400 block mb-1">Lot ID</label><input name="lot" value={formData.lot} onChange={handleChange} className="w-full bg-[#0b1220] border border-[#1e2d4d] rounded px-2 py-1.5 text-white font-mono" /></div>
              <div><label className="text-slate-400 block mb-1">Date</label><input type="date" name="date" value={formData.date} onChange={handleChange} className="w-full bg-[#0b1220] border border-[#1e2d4d] rounded px-2 py-1.5 text-white font-mono" /></div>
              <div><label className="text-slate-400 block mb-1">Qty (MT)</label><input type="number" name="qty" value={formData.qty} onChange={handleChange} className="w-full bg-[#0b1220] border border-[#1e2d4d] rounded px-2 py-1.5 text-white font-mono" /></div>
              <div><label className="text-slate-400 block mb-1">{isBuy ? 'Landed Price' : 'Sell Price'}</label><input type="number" name={isBuy ? 'landed' : 'price'} value={isBuy ? formData.landed : formData.price} onChange={handleChange} className="w-full bg-[#0b1220] border border-[#1e2d4d] rounded px-2 py-1.5 text-white font-mono" /></div>
              
              <div className="col-span-2">
                <label className="text-slate-400 block mb-1">{isBuy ? 'Supplier / CAT' : 'Buyer / CAT'}</label>
                <input name="cat" value={formData.cat || ''} onChange={handleChange} className="w-full bg-[#0b1220] border border-[#1e2d4d] rounded px-2 py-1.5 text-white" />
              </div>

              {isBuy && (
                <div className="col-span-2">
                  <label className="text-slate-400 block mb-1">Attach Purchase Agreement</label>
                  <input type="file" accept=".pdf,image/*" onChange={handleFileChange} className="w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-[11px] file:font-semibold file:bg-[#16223d] file:text-blue-300 hover:file:bg-[#1e2d4d] cursor-pointer border border-[#1e2d4d] rounded-xl bg-[#0b1220] py-1.5" />
                  {formData.file && formData.file !== 'No File' && (<div className="text-[10px] text-emerald-400 mt-1 truncate">Current: {formData.file}</div>)}
                </div>

            <div className="flex justify-end gap-2 pt-2">
              <button onClick={onClose} className="px-3 py-1.5 text-xs text-slate-400 hover:text-white">Cancel</button>
              <button onClick={() => onSave(formData)} className="px-3 py-1.5 text-xs bg-blue-600 text-white rounded">Save Changes</button>
            </div>
          </div>
        </div>
      );
    };

    const EditHedgeModal = ({ editing, onClose, onSave }) => {
      const [formData, setFormData] = useState(editing);
      if (!editing) return null;
      const handleChange = (e) => setFormData({ ...formData, [e.target.name]: e.target.value });
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
          <div className="bg-[#111c33] border border-[#1e2d4d] rounded-2xl p-6 w-full max-w-md shadow-2xl space-y-4">
            <h3 className="text-sm font-bold text-white">Edit Hedge Trade ({formData.tradeId})</h3>
            <div className="grid grid-cols-2 gap-3 text-xs">
              <div><label className="text-slate-400 block mb-1">Trade Date</label><input type="date" name="date" value={formData.date} onChange={handleChange} className="w-full bg-[#0b1220] border border-[#1e2d4d] rounded px-2 py-1.5 text-white font-mono" /></div>
              <div><label className="text-slate-400 block mb-1">Prompt/Expiry</label><input type="date" name="prompt" value={formData.prompt} onChange={handleChange} className="w-full bg-[#0b1220] border border-[#1e2d4d] rounded px-2 py-1.5 text-white font-mono" /></div>
              <div><label className="text-slate-400 block mb-1">Buy Qty (Lots)</label><input type="number" name="buyQty" value={formData.buyQty} onChange={handleChange} className="w-full bg-[#0b1220] border border-[#1e2d4d] rounded px-2 py-1.5 text-white font-mono" /></div>
              <div><label className="text-slate-400 block mb-1">Buy Rate</label><input type="number" name="buyRate" value={formData.buyRate} onChange={handleChange} className="w-full bg-[#0b1220] border border-[#1e2d4d] rounded px-2 py-1.5 text-white font-mono" /></div>
              <div><label className="text-slate-400 block mb-1">Sell Qty (Lots)</label><input type="number" name="sellQty" value={formData.sellQty} onChange={handleChange} className="w-full bg-[#0b1220] border border-[#1e2d4d] rounded px-2 py-1.5 text-white font-mono" /></div>
              <div><label className="text-slate-400 block mb-1">Sell Rate</label><input type="number" name="sellRate" value={formData.sellRate} onChange={handleChange} className="w-full bg-[#0b1220] border border-[#1e2d4d] rounded px-2 py-1.5 text-white font-mono" /></div>
              <div className="col-span-2"><label className="text-slate-400 block mb-1">Assigned Lot ID</label><input name="mappedLot" value={formData.mappedLot} onChange={handleChange} className="w-full bg-[#0b1220] border border-[#1e2d4d] rounded px-2 py-1.5 text-white font-mono uppercase" /></div>
            </div>
            <div className="flex justify-end gap-2 pt-2">
              <button onClick={onClose} className="px-3 py-1.5 text-xs text-slate-400 hover:text-white">Cancel</button>
              <button onClick={() => onSave(formData)} className="px-3 py-1.5 text-xs bg-blue-600 text-white rounded">Save Changes</button>
            </div>
          </div>
        </div>
      );
    };

    const RolloverModal = ({ item, onClose, onExecuteRollover }) => {
      if (!item) return null; const openNetMT = Math.abs(item.netQtyMT); const lotMultiplier = getLotMultiplier(item.exchange, item.metal); const openLots = openNetMT / lotMultiplier; const isShort = item.netQtyMT < 0;
      const currentDate = new Date(item.prompt + 'T00:00:00'); const targetDateDefault = new Date(currentDate); targetDateDefault.setDate(targetDateDefault.getDate() + 35);
      const [newPromptDate, setNewPromptDate] = useState(targetDateDefault.toISOString().slice(0, 10)); const [squareRate, setSquareRate] = useState(item.settlePrice || 2400); const [spread, setSpread] = useState(10); const [spreadType, setSpreadType] = useState('CONTANGO'); const [assignedLot, setAssignedLot] = useState(item.lots[0]?.lot || '');
      const forwardRate = spreadType === 'CONTANGO' ? squareRate + (isShort ? spread : -spread) : squareRate - (isShort ? spread : -spread);
      const handleExecute = () => {
        if (!newPromptDate) return; const todayStr = new Date().toISOString().slice(0, 10); const rolloverIdBase = `ROLL-${Date.now().toString().slice(-5)}`;
        const closeTrade = { id: `roll-close-${Date.now()}-1`, tradeId: `${rolloverIdBase}-SQ`, exch: item.exchange, metal: shortMetal(item.metal), date: todayStr, prompt: item.prompt, buyQty: isShort ? openLots : 0, buyRate: isShort ? squareRate : 0, sellQty: isShort ? 0 : openLots, sellRate: isShort ? 0 : squareRate, mappedLot: assignedLot || item.lots[0]?.lot || '', archived: false };
        const forwardTrade = { id: `roll-open-${Date.now()}-2`, tradeId: `${rolloverIdBase}-FWD`, exch: item.exchange, metal: shortMetal(item.metal), date: todayStr, prompt: newPromptDate, buyQty: isShort ? 0 : openLots, buyRate: isShort ? 0 : forwardRate, sellQty: isShort ? openLots : 0, sellRate: isShort ? forwardRate : 0, mappedLot: assignedLot || item.lots[0]?.lot || '', archived: false };
        onExecuteRollover([closeTrade, forwardTrade]); onClose();
      };
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm">
          <div className="bg-gradient-to-b from-[#111c33] to-[#16223d] border border-[#1e2d4d] rounded-2xl shadow-2xl w-full max-w-xl overflow-hidden">
            <div className="px-6 py-4 border-b border-[#1e2d4d] flex items-center justify-between bg-[#16223d]"><h2 className="text-base font-bold text-white">Prompt Rollover Simulator ({item.exchange} {shortMetal(item.metal)})</h2><button onClick={onClose} className="text-slate-400 hover:text-white cursor-pointer"><X className="w-4 h-4" /></button></div>
            <div className="p-6 space-y-4 text-xs">
              <div className="grid grid-cols-2 gap-4">
                <div><label className="block text-[11px] font-semibold uppercase text-slate-400 mb-1">Target Forward Prompt Date</label><input type="date" value={newPromptDate} onChange={e => setNewPromptDate(e.target.value)} className="w-full bg-[#0b1220] border border-[#1e2d4d] rounded-xl px-3 py-2 text-xs text-slate-200 font-mono" /></div>
                <div><label className="block text-[11px] font-semibold uppercase text-slate-400 mb-1">Assigned Lot ID</label><input type="text" value={assignedLot} onChange={e => setAssignedLot(e.target.value.toUpperCase())} className="w-full bg-[#0b1220] border border-[#1e2d4d] rounded-xl px-3 py-2 text-xs text-slate-200 font-mono uppercase" /></div>
                <div><label className="block text-[11px] font-semibold uppercase text-slate-400 mb-1">Near Leg Square Price</label><input type="number" step="any" value={squareRate} onChange={e => setSquareRate(parseFloat(e.target.value) || 0)} className="w-full bg-[#0b1220] border border-[#1e2d4d] rounded-xl px-3 py-2 text-xs text-slate-200 font-mono" /></div>
                <div><label className="block text-[11px] font-semibold uppercase text-slate-400 mb-1">Spread</label><div className="flex gap-2"><select value={spreadType} onChange={e => setSpreadType(e.target.value)} className="bg-[#0b1220] border border-[#1e2d4d] rounded-xl px-2 py-2 text-xs text-slate-300"><option value="CONTANGO">Contango (+)</option><option value="BACKWARDATION">Backw. (-)</option></select><input type="number" step="any" value={spread} onChange={e => setSpread(parseFloat(e.target.value) || 0)} className="w-20 bg-[#0b1220] border border-[#1e2d4d] rounded-xl px-2 py-2 text-xs text-slate-200 font-mono text-right" /></div></div>
              </div>
              <div className="flex justify-end gap-2 pt-3"><button onClick={onClose} className="px-4 py-2 rounded-xl text-slate-400 cursor-pointer">Cancel</button><button onClick={handleExecute} className="px-5 py-2 rounded-xl bg-blue-600 text-white font-semibold cursor-pointer">Execute 2-Leg Rollover</button></div>
            </div>
          </div>
        </div>
      );
    };

    const BulkPasteModal = ({ title, description, placeholder, onApply, onClose }) => {
      const [text, setText] = useState('');
      const handleApply = () => { const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0); onApply(lines); onClose(); };
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm">
          <div className="bg-gradient-to-b from-[#111c33] to-[#16223d] border border-[#1e2d4d] rounded-2xl shadow-2xl w-full max-w-md overflow-hidden p-5 space-y-3">
            <div className="flex items-center justify-between"><h3 className="text-sm font-bold text-white">{title}</h3><button onClick={onClose} className="text-slate-400 hover:text-white cursor-pointer"><X className="w-4 h-4" /></button></div>
            <p className="text-xs text-slate-400">{description}</p>
            <textarea rows={8} value={text} onChange={e => setText(e.target.value)} placeholder={placeholder} className="w-full bg-[#0b1220] border border-[#1e2d4d] rounded-xl p-3 text-xs text-slate-200 font-mono" />
            <div className="flex justify-end gap-2"><button onClick={onClose} className="px-3 py-1.5 rounded-xl text-xs text-slate-400 cursor-pointer">Cancel</button><button onClick={handleApply} className="px-4 py-1.5 rounded-xl text-xs font-semibold bg-blue-600 text-white cursor-pointer">Apply</button></div>
          </div>
        </div>
      );
    };

    const ConfirmModal = ({ isOpen, title, message, confirmText = 'Confirm', isDestructive = true, onConfirm, onClose }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
          <div className="bg-gradient-to-b from-[#111c33] to-[#16223d] border border-[#1e2d4d] rounded-2xl shadow-2xl w-full max-w-md p-5 space-y-4">
            <div className="flex items-center justify-between"><h3 className="text-sm font-bold text-white">{title}</h3><button onClick={onClose} className="text-slate-400 cursor-pointer"><X className="w-4 h-4" /></button></div>
            <p className="text-xs text-slate-300 whitespace-pre-line">{message}</p>
            <div className="flex justify-end gap-2"><button onClick={onClose} className="px-4 py-2 rounded-xl text-xs text-slate-400 cursor-pointer">Cancel</button><button onClick={() => { onConfirm(); onClose(); }} className={`px-4 py-2 rounded-xl text-xs font-semibold text-white cursor-pointer ${isDestructive ? 'bg-rose-600' : 'bg-blue-600'}`}>{confirmText}</button></div>
          </div>
        </div>
      );
    };

    const SyncPromptsModal = ({ isOpen, onClose, openPromptItems, onUpdateSettlePrice, onBulkUpdateSettles, onClearSettles }) => {
      const [pasteText, setPasteText] = useState(''); const [showPaste, setShowPaste] = useState(false);
      if (!isOpen) return null; const unSquaredItems = openPromptItems.filter(i => Math.abs(i.netQtyMT) > 0.0001);
      const handleApplyPaste = () => {
        const lines = pasteText.split(/\r?\n/).map(l => parseFloat(l.replace(/[,\s₹$]/g, ''))).filter(n => !isNaN(n));
        const updates = unSquaredItems.slice(0, lines.length).map((item, idx) => ({ metal: item.metal, exchange: item.exchange, prompt: item.prompt, price: lines[idx] }));
        onBulkUpdateSettles(updates); setShowPaste(false); setPasteText('');
      };
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
          <div className="bg-gradient-to-b from-[#111c33] to-[#16223d] border border-[#1e2d4d] rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-hidden flex flex-col">
            <div className="px-6 py-4 border-b border-[#1e2d4d] flex items-center justify-between bg-[#16223d]"><h2 className="text-base font-bold text-white">Daily MTM &amp; Open Prompts Auto-Sync</h2><div className="flex items-center gap-2"><button onClick={() => setShowPaste(!showPaste)} className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 text-white cursor-pointer">Paste Settle Column</button><button onClick={onClearSettles} className="px-2.5 py-1.5 rounded-lg text-xs text-rose-400 cursor-pointer">Clear Settles</button><button onClick={onClose} className="text-slate-400 hover:text-white cursor-pointer"><X className="w-4 h-4" /></button></div></div>
            {showPaste && (<div className="p-4 bg-[#0e1830] border-b border-[#1e2d4d] space-y-2"><textarea rows={4} value={pasteText} onChange={e => setPasteText(e.target.value)} placeholder="Paste column of settle prices..." className="w-full bg-[#0b1220] border border-[#1e2d4d] rounded-xl p-2 text-xs text-slate-200 font-mono" /><button onClick={handleApplyPaste} className="px-4 py-1.5 rounded-lg text-xs font-semibold bg-emerald-600 text-white cursor-pointer">Apply Column</button></div>)}
            <div className="flex-1 overflow-y-auto p-6">

    const LotDetailModal = ({ lotId, onClose, buys, sells, promptLegs = [], dashboardData = [], hedgeData = [] }) => {

      const totalBuyQty = lotBuys.reduce((sum, b) => sum + (parseFloat(b.qty) || 0), 0); const totalBuyVal = lotBuys.reduce((sum, b) => sum + ((parseFloat(b.qty) || 0) * (parseFloat(b.landed) || 0)), 0); const wAvgBuyPrice = totalBuyQty > 0 ? totalBuyVal / totalBuyQty : 0;

            </div>
            <div className="space-y-2">

                  const exData = hedge[exch.toLowerCase()] || {}; const isLME = exch === 'LME'; const hasActivity = exData.buyQty > 0 || exData.sellQty > 0 || exData.mtm !== 0;

                      <div className="grid grid-cols-2 gap-2 text-xs font-mono"><div className="text-slate-400">W.Avg Buy:</div><div className="text-right text-slate-200">{exData.avgBuyP ? fmt(exData.avgBuyP, 2) : '—'}</div><div className="text-slate-400">W.Avg Sell:</div><div className="text-right text-slate-200">{exData.avgSellP ? fmt(exData.avgSellP, 2) : '—'}</div><div className="text-slate-400">Net Position:</div><div className={`text-right font-bold ${pnlClass(exData.netQty)}`}>{fmt(exData.netQty || 0, 2)} MT</div><div className="text-slate-400">Realized PnL:</div><div className={`text-right font-bold ${pnlClass(exData.realized)}`}>{fmt(exData.realized || 0)}</div><div className="text-slate-400">Open MTM:</div><div className={`text-right font-bold ${pnlClass(exData.mtm)}`}>{fmt(exData.mtm || 0)}</div></div>
                    </div>
                  );
                })}
              </div>
            </div>
            <div className="bg-gradient-to-r from-[#14203a] to-[#111c33] border border-[#1e2d4d] rounded-xl p-4 flex items-center justify-between flex-wrap gap-4">
              <div><h4 className="text-xs font-bold uppercase text-amber-400 flex items-center gap-2"><LayoutDashboard className="w-4 h-4" /> Final Dashboard Summary</h4><p className="text-[10px] text-slate-400 mt-1">Combined physical + exchange position for this lot.</p></div>
              <div className="flex items-center gap-6">
                <div className="text-center"><div className="text-[10px] text-slate-400 uppercase">Naked Exposure</div><div className={`text-sm font-mono font-bold ${pnlClass(dash.nakedExposure)}`}>{fmt(dash.nakedExposure || 0, 2)} MT</div></div>
                <div className="text-center"><div className="text-[10px] text-slate-400 uppercase">Total Hedge MTM</div><div className={`text-sm font-mono font-bold ${pnlClass(dash.totalHedgeMTM)}`}>{fmt(dash.totalHedgeMTM || 0)}</div></div>
                <div className="text-center"><div className="text-[10px] text-slate-400 uppercase">Total Net Realized</div><div className={`text-sm font-mono font-bold ${pnlClass(dash.totalNetRealizedPnL)}`}>{fmt(dash.totalNetRealizedPnL || 0)}</div></div>
                <div className={`px-3 py-1.5 rounded-lg border text-xs font-bold ${dash.instruction?.includes('UNDER') || dash.instruction?.includes('OVER') ? 'bg-rose-500/15 text-rose-400 border-rose-500/30' : dash.instruction?.includes('FULLY') ? 'bg-emerald-500/15 text-emerald-400 border-emerald-500/30' : 'bg-amber-500/15 text-amber-300 border-amber-500/30'}`}>{dash.instruction || 'NO INSTRUCTION'}</div>
              </div>
            </div>
            <div className="space-y-2">
              <h4 className="text-xs font-bold uppercase text-slate-300 flex items-center gap-2"><Clock className="w-4 h-4" /> Prompt Legs Ledger</h4>
              <div className="border border-[#1e2d4d] rounded-xl overflow-hidden bg-[#0b1220]">
                <table className="w-full text-xs text-left font-mono">
                  <thead><tr className="bg-[#16223d] text-slate-400 uppercase text-[10px] border-b border-[#1e2d4d]"><th className="py-2 px-3">Prompt Date</th><th className="py-2 px-3">Status</th><th className="py-2 px-3 text-right">Buy MT</th><th className="py-2 px-3 text-right">Sell MT</th><th className="py-2 px-3 text-right">Net MT</th><th className="py-2 px-3 text-right">Realized PnL</th><th className="py-2 px-3 text-right">Open MTM</th></tr></thead>
                  <tbody className="divide-y divide-[#182543]">
                    {promptLegs.length === 0 ? (<tr><td colSpan={7} className="py-4 text-center text-slate-500 italic">No prompt legs recorded.</td></tr>) : (promptLegs.map(leg => (<tr key={leg.prompt} className="hover:bg-[#16223d]/50 transition-colors"><td className="py-2 px-3 font-bold text-white">{leg.prompt}</td><td className="py-2 px-3 font-sans text-slate-300">{leg.statusDetail}</td><td className="py-2 px-3 text-right text-slate-400">{fmt(leg.buyQtyMT, 2)}</td><td className="py-2 px-3 text-right text-slate-400">{fmt(leg.sellQtyMT, 2)}</td><td className={`py-2 px-3 text-right font-bold ${pnlClass(leg.netQtyMT)}`}>{fmt(leg.netQtyMT, 2)}</td><td className={`py-2 px-3 text-right font-bold ${pnlClass(leg.realizedPnL)}`}>{fmt(leg.realizedPnL)}</td><td className={`py-2 px-3 text-right font-bold ${pnlClass(leg.openMTM)}`}>{fmt(leg.openMTM)}</td></tr>)))}

    const AlertsDrawer = ({ isOpen, onClose, alerts, onSelectLot, onNavigateToPromptMatrix }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex justify-end bg-black/60 backdrop-blur-xs">
          <div className="w-full max-w-md bg-[#0e1830] border-l border-[#1e2d4d] h-full shadow-2xl flex flex-col">
            <div className="px-5 py-4 border-b border-[#1e2d4d] bg-[#111c33] flex items-center justify-between"><h2 className="text-sm font-bold text-white">Risk &amp; Compliance Center ({alerts.length})</h2><button onClick={onClose} className="text-slate-400 hover:text-white cursor-pointer"><X className="w-4 h-4" /></button></div>
            <div className="flex-1 overflow-y-auto p-4 space-y-2">
              {alerts.map(a => (<div key={a.id} onClick={() => { if (a.type === 'mismatch' || a.type === 'prompt') onNavigateToPromptMatrix(a.promptDate); else if (a.lot && a.lot !== 'UNMAPPED') onSelectLot(a.lot); onClose(); }} className="p-3 rounded-xl bg-[#111c33] border border-[#1e2d4d] hover:border-slate-600 cursor-pointer text-xs space-y-1"><div className="flex items-center justify-between"><span className="font-mono font-bold text-blue-300">{a.lot}</span><span className="font-mono text-slate-400">{a.val}</span></div><p className="text-slate-300">{a.msg}</p></div>))}
            </div>
          </div>
        </div>
      );
    };

    // ==================== MAIN APP ====================
    function App() {
      const fileInputRef = useRef(null);
      const [theme, setTheme] = useState(() => { try { return localStorage.getItem('hb_theme') || 'dark'; } catch { return 'dark'; } });
      
      // --- FIREBASE DATA STATES ---
      const [buys, setBuys] = useState([]);
      const [sells, setSells] = useState([]);
      const [hedges, setHedges] = useState([]);
      const [liveSettles, setLiveSettles] = useState([]);
      const [lotFxRates, setLotFxRates] = useState({});
      const [isDataLoaded, setIsDataLoaded] = useState(false);
      const [editingPhysical, setEditingPhysical] = useState(null); 
      const [editingHedge, setEditingHedge] = useState(null);       

      useEffect(() => {
        try { localStorage.setItem('hb_theme', theme); } catch {}
        if (theme === 'light') document.documentElement.classList.add('light-theme'); else document.documentElement.classList.remove('light-theme');
      }, [theme]);

      // LOAD FROM FIREBASE (Safe Version)
      useEffect(() => {
        let isMounted = true;
        const loadData = async () => {
          if (!window.firebaseDB) {
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          try {
            if (!window.firebaseDB) throw new Error("Firebase script blocked by browser.");
            const docRef = window.firebaseDoc(window.firebaseDB, "hedgebook", "data");
            const docSnap = await window.firebaseGetDoc(docRef);
             if (docSnap.exists && isMounted) {
             const data = docSnap.data() || docSnap;
              setBuys(data.buys || []);
              setSells(data.sells || []);
              setHedges(data.hedges || []);
              setLiveSettles(data.liveSettles || []);
              setLotFxRates(data.lotFxRates || {});
            }
          } catch (error) {
            console.error("Firebase Load Error:", error);
          } finally {
            if (isMounted) setIsDataLoaded(true);
          }
        };
        loadData();
        return () => { isMounted = false; };
      }, []);

      // SAVE TO FIREBASE HELPER
      const saveToFirebase = async (newBuys, newSells, newHedges, newSettles, newFx) => {
        try {
          if (!window.firebaseDoc) {
            await new Promise(resolve => setTimeout(resolve, 1500));
          }
          if (!window.firebaseDoc) throw new Error("Firebase script blocked by browser.");
          const docRef = window.firebaseDoc(window.firebaseDB, "hedgebook", "data");
          await window.firebaseSetDoc(docRef, {
            buys: newBuys, sells: newSells, hedges: newHedges, liveSettles: newSettles, lotFxRates: newFx
          });
          console.log("Saved to Firebase successfully!");
        } catch (error) {
          console.error("Error saving:", error);
          showToast("Failed to save to cloud. Check console.");
        }
      };
      
      const defaultFx = 84.2;
      const [activeTab, setActiveTab] = useState('matrix');
      const [currentMetal, setCurrentMetal] = useState('BOTH');
      const [currentPeriod, setCurrentPeriod] = useState('ALL');
      const [periodBasis, setPeriodBasis] = useState('prompt');
      const [isSidebarOpen, setIsSidebarOpen] = useState(true);
      const [selectedLot, setSelectedLot] = useState(null);
      const [rolloverItem, setRolloverItem] = useState(null);
      const [isSyncModalOpen, setIsSyncModalOpen] = useState(false);
      const [isBulkPasteModalOpen, setIsBulkPasteModalOpen] = useState(false);
      const [highlightPrompt, setHighlightPrompt] = useState(undefined);
      const [toastMessage, setToastMessage] = useState(null);
      const [isAlertsDrawerOpen, setIsAlertsDrawerOpen] = useState(false);
      const [confirmDialog, setConfirmDialog] = useState({ isOpen: false, title: '', message: '', onConfirm: () => {} });

      const showToast = (msg) => { setToastMessage(msg); setTimeout(() => setToastMessage(prev => (prev === msg ? null : prev)), 3000); };

      const availableMonths = useMemo(() => {
        const months = new Set();
        buys.forEach(b => { const d = dkey(b.date); if (d.length >= 7) months.add(d.slice(0, 7)); });
        sells.forEach(s => { const d = dkey(s.date); if (d.length >= 7) months.add(d.slice(0, 7)); });
        hedges.forEach(h => { const target = periodBasis === 'trade' ? h.date : h.prompt; const d = dkey(target || h.date); if (d.length >= 7) months.add(d.slice(0, 7)); });
        return Array.from(months).sort();
      }, [buys, sells, hedges, periodBasis]);

      const filteredBuys = useMemo(() => currentPeriod === 'ALL' ? buys : buys.filter(b => dkey(b.date).startsWith(currentPeriod)), [buys, currentPeriod]);
      const filteredSells = useMemo(() => currentPeriod === 'ALL' ? sells : sells.filter(s => dkey(s.date).startsWith(currentPeriod)), [sells, currentPeriod]);
      const filteredHedges = useMemo(() => {
        if (currentPeriod === 'ALL') return hedges;
        return hedges.filter(h => { const target = periodBasis === 'trade' ? h.date : h.prompt; return dkey(target).startsWith(currentPeriod); });
      }, [hedges, currentPeriod, periodBasis]);

      const engineResult = useMemo(() => buildEngine(filteredBuys, filteredSells, filteredHedges, liveSettles, defaultFx, lotFxRates), [filteredBuys, filteredSells, filteredHedges, liveSettles, defaultFx, lotFxRates]);

      const metalCounts = useMemo(() => ({
        ALUMINIUM: engineResult.physical.filter(r => canonicalMetal(r.metal) === 'ALUMINIUM').length,
        ZINC: engineResult.physical.filter(r => canonicalMetal(r.metal) === 'ZINC').length,
        COPPER: engineResult.physical.filter(r => canonicalMetal(r.metal) === 'COPPER').length,
        BOTH: engineResult.physical.length
      }), [engineResult.physical]);

      const filteredPhysical = useMemo(() => currentMetal === 'BOTH' ? engineResult.physical : engineResult.physical.filter(r => canonicalMetal(r.metal) === currentMetal), [engineResult.physical, currentMetal]);
      const filteredHedge = useMemo(() => currentMetal === 'BOTH' ? engineResult.hedge : engineResult.hedge.filter(r => canonicalMetal(r.metal) === currentMetal), [engineResult.hedge, currentMetal]);
      const filteredDashboard = useMemo(() => currentMetal === 'BOTH' ? engineResult.dashboard : engineResult.dashboard.filter(r => canonicalMetal(r.metal) === currentMetal), [engineResult.dashboard, currentMetal]);

      const handleUpdateLotFx = (lotId, fx) => { const newFx = { ...lotFxRates, [lotId.trim().toUpperCase()]: fx }; setLotFxRates(newFx); saveToFirebase(buys, sells, hedges, liveSettles, newFx); };

      const handleSyncOpenPrompts = () => {
        const { updatedSettles, newPromptsAdded } = syncOpenPrompts(hedges, liveSettles);
        setLiveSettles(updatedSettles); setIsSyncModalOpen(true); saveToFirebase(buys, sells, hedges, updatedSettles, lotFxRates);
        showToast(newPromptsAdded > 0 ? `Synced ${newPromptsAdded} open prompt(s)!` : 'All open prompts synchronized.');
      };

      const handleUpdateSettlePrice = (metal, exchange, prompt, price) => {
        const m = shortMetal(metal); const idx = liveSettles.findIndex(s => shortMetal(s.metal) === m && s.exchange === exchange && s.prompt === prompt);
        let ns = [...liveSettles];
        if (idx >= 0) { ns[idx] = { ...ns[idx], settle: price, updatedAt: new Date().toISOString() }; }
        else { ns = [...liveSettles, { id: `settle-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`, metal: m, exchange, prompt, settle: price, updatedAt: new Date().toISOString() }]; }
        setLiveSettles(ns); saveToFirebase(buys, sells, hedges, ns, lotFxRates);
      };

      const handleBulkUpdateSettles = (newPrices) => {
        let ns = [...liveSettles];
        newPrices.forEach(np => {
          const m = shortMetal(np.metal); const idx = ns.findIndex(s => shortMetal(s.metal) === m && s.exchange === np.exchange && s.prompt === np.prompt);
          if (idx >= 0) ns[idx] = { ...ns[idx], settle: np.price };
          else ns.push({ id: `settle-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`, metal: m, exchange: np.exchange, prompt: np.prompt, settle: np.price });
        });
        setLiveSettles(ns); saveToFirebase(buys, sells, hedges, ns, lotFxRates); showToast(`Updated settle prices!`);
      };

      const handleExecuteRollover = (newTrades) => { const nh = [...hedges, ...newTrades]; setHedges(nh); saveToFirebase(buys, sells, nh, liveSettles, lotFxRates); showToast('Executed 2-leg rollover!'); };

      const handleExportExcel = () => { const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(engineResult.promptMatrix), 'Prompt Matrix'); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(engineResult.dashboard), 'Dashboard'); XLSX.writeFile(wb, `HedgeBook_${new Date().toISOString().slice(0, 10)}.xlsx`); showToast('Exported Excel!'); };

      const selectedLotPromptLegs = useMemo(() => { if (!selectedLot) return []; const hedgeItem = engineResult.hedge.find(h => h.lot.toUpperCase() === selectedLot.toUpperCase()); if (!hedgeItem) return []; return [...hedgeItem.lme.promptLegs, ...hedgeItem.mcx.promptLegs]; }, [selectedLot, engineResult.hedge]);

      const tabs = [
        { id: 'matrix', label: 'Prompt Matrix', icon: Calendar },
        { id: 'dashboard', label: 'Combined Dashboard', icon: LayoutDashboard },
        { id: 'physical', label: 'Physical Analytics', icon: BarChart3 },
        { id: 'hedge', label: 'Hedge Analytics', icon: TrendingUp },
        { id: 'entry-phys', label: 'Physical Entry', icon: PackagePlus },
        { id: 'entry-hedge', label: 'Hedge Mapper & Upload', icon: Link2 },
      ];

      if (!isDataLoaded) return <div className="flex h-screen items-center justify-center bg-[#0b1220] text-white">Connecting to Firebase...</div>;

      return (
        <div className="flex h-screen overflow-hidden bg-[#0b1220] text-[#e6ecf5] transition-colors">
          {toastMessage && (<div className="fixed bottom-6 right-6 z-50 flex items-center gap-2 px-4 py-2.5 rounded-xl bg-emerald-500 text-slate-950 text-xs font-bold shadow-2xl"><CheckCircle2 className="w-4 h-4" /><span>{toastMessage}</span></div>)}
          <aside className={`bg-[#0f172a] border-r border-[#1e2d4d] flex flex-col transition-all duration-300 z-20 ${isSidebarOpen ? 'w-64' : 'w-0 overflow-hidden border-r-0'}`}>
            <div className="h-[53px] flex items-center px-4 border-b border-[#1e2d4d] whitespace-nowrap"><span className="font-bold text-sm tracking-wider uppercase text-slate-400">Menu</span></div>
            <div className="flex-1 overflow-y-auto py-4 space-y-1 px-3">
              {tabs.map(tab => { const Icon = tab.icon; const isActive = activeTab === tab.id; return (<button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all cursor-pointer whitespace-nowrap ${isActive ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white hover:bg-[#16223d]'}`}><Icon className={`w-4 h-4 ${isActive ? 'text-white' : 'text-slate-500'}`} /><span>{tab.label}</span></button>); })}
            </div>
          </aside>
          <div className="flex-1 flex flex-col min-w-0">
            <Header theme={theme} onToggleTheme={() => setTheme(prev => (prev === 'dark' ? 'light' : 'dark'))} alertsCount={engineResult.alerts.length} onOpenAlertsDrawer={() => setIsAlertsDrawerOpen(true)} currentPeriod={currentPeriod} onPeriodChange={setCurrentPeriod} periodBasis={periodBasis} onPeriodBasisChange={setPeriodBasis} availableMonths={availableMonths} isSidebarOpen={isSidebarOpen} onToggleSidebar={() => setIsSidebarOpen(!isSidebarOpen)} />
            <main className="flex-1 overflow-y-auto p-6">
              <div className="max-w-[1600px] mx-auto space-y-5">
                <AlertsBanner alerts={engineResult.alerts} onSelectLot={setSelectedLot} onNavigateToPromptMatrix={promptDate => { setActiveTab('matrix'); setHighlightPrompt(promptDate); }} onOpenDrawer={() => setIsAlertsDrawerOpen(true)} />
                <div className="flex items-center justify-between gap-3 flex-wrap">
                  <MetalPicker currentMetal={currentMetal} onSelectMetal={setCurrentMetal} counts={metalCounts} />
                  <div className="flex items-center gap-1.5 p-1.5 bg-[#111c33] border border-[#1e2d4d] rounded-2xl shadow-sm mb-4">
                    <button onClick={handleSyncOpenPrompts} className="p-2 rounded-xl text-emerald-400 hover:bg-[#16223d] cursor-pointer" title="Sync Open Prompts"><RefreshCw className="w-4 h-4" /></button>
                    <button onClick={handleExportExcel} className="p-2 rounded-xl text-blue-400 hover:bg-[#16223d] cursor-pointer" title="Export Excel"><Download className="w-4 h-4" /></button>
                  </div>
                </div>
                {activeTab === 'matrix' && (<PromptMatrix items={engineResult.promptMatrix} currentMetal={currentMetal} onSelectLot={setSelectedLot} onOpenRolloverModal={setRolloverItem} onSyncOpenPrompts={handleSyncOpenPrompts} onUpdateSettlePrice={handleUpdateSettlePrice} highlightPrompt={highlightPrompt} />)}
                {activeTab === 'dashboard' && (<CombinedDashboard data={filteredDashboard} onSelectLot={setSelectedLot} onOpenPromptMatrix={promptDate => { setActiveTab('matrix'); setHighlightPrompt(promptDate); }} />)}
                {activeTab === 'physical' && (<PhysicalAnalytics data={filteredPhysical} onSelectLot={setSelectedLot} />)}
                {activeTab === 'hedge' && (<HedgeAnalytics data={filteredHedge} onSelectLot={setSelectedLot} onUpdateLotFx={handleUpdateLotFx} />)}
                {activeTab === 'entry-phys' && (<PhysicalEntry buys={buys} sells={sells} setEditingPhysical={setEditingPhysical} onAddBuy={buy => { const nb = [...buys, buy]; setBuys(nb); saveToFirebase(nb, sells, hedges, liveSettles, lotFxRates); showToast(`Saved Buy`); }} onAddSell={sell => { const ns = [...sells, sell]; setSells(ns); saveToFirebase(buys, ns, hedges, liveSettles, lotFxRates); showToast(`Saved Sell`); }} onDeleteBuy={id => { const nb = buys.filter(b => b.id !== id); setBuys(nb); saveToFirebase(nb, sells, hedges, liveSettles, lotFxRates); }} onDeleteSell={id => { const ns = sells.filter(s => s.id !== id); setSells(ns); saveToFirebase(buys, ns, hedges, liveSettles, lotFxRates); }} />)}
                {activeTab === 'entry-hedge' && (<HedgeMapper hedges={hedges} liveSettles={liveSettles} setEditingHedge={setEditingHedge} onImportTrades={nt => { const nh = [...hedges, ...nt]; setHedges(nh); saveToFirebase(buys, sells, nh, liveSettles, lotFxRates); showToast(`Imported trades`); }} onAddHedgeTrade={t => { const nh = [...hedges, t]; setHedges(nh); saveToFirebase(buys, sells, nh, liveSettles, lotFxRates); showToast(`Added trade`); }} onUpdateHedgeTrade={(id, up) => { const nh = hedges.map(h => h.id === id ? { ...h, ...up } : h); setHedges(nh); saveToFirebase(buys, sells, nh, liveSettles, lotFxRates); }} onDeleteHedgeTrade={id => { const nh = hedges.filter(h => h.id !== id); setHedges(nh); saveToFirebase(buys, sells, nh, liveSettles, lotFxRates); }} onAddLiveSettle={(m,e,p,s) => { const ns = liveSettles.filter(x => !(x.metal === m && x.exchange === e && x.prompt === p)); ns.push({ id: `s-${Date.now()}`, metal: m, exchange: e, prompt: p, settle: s }); setLiveSettles(ns); saveToFirebase(buys, sells, hedges, ns, lotFxRates); showToast(`Saved settle price`); }} onDeleteLiveSettle={id => { const ns = liveSettles.filter(s => s.id !== id); setLiveSettles(ns); saveToFirebase(buys, sells, hedges, ns, lotFxRates); }} onSyncOpenPrompts={handleSyncOpenPrompts} onOpenBulkPasteModal={() => setIsBulkPasteModalOpen(true)} onClearMappedTrades={() => { const nh = hedges.map(h => h.mappedLot ? { ...h, archived: true } : h); setHedges(nh); saveToFirebase(buys, sells, nh, liveSettles, lotFxRates); }} onRestoreArchivedTrades={() => { const nh = hedges.map(h => ({ ...h, archived: false })); setHedges(nh); saveToFirebase(buys, sells, nh, liveSettles, lotFxRates); }} onDeleteAllHedgeTrades={() => { setConfirmDialog({ isOpen: true, title: 'Delete All?', message: 'Delete all trades?', onConfirm: () => { setHedges([]); saveToFirebase(buys, sells, [], liveSettles, lotFxRates); } }); }} archivedCount={hedges.filter(h => h.archived).length} />)}
              </div>
            </main>
          </div>
          {rolloverItem && (<RolloverModal item={rolloverItem} onClose={() => setRolloverItem(null)} onExecuteRollover={handleExecuteRollover} />)}
          <SyncPromptsModal isOpen={isSyncModalOpen} onClose={() => setIsSyncModalOpen(false)} openPromptItems={engineResult.promptMatrix} onUpdateSettlePrice={handleUpdateSettlePrice} onBulkUpdateSettles={handleBulkUpdateSettles} onClearSettles={() => { setLiveSettles([]); saveToFirebase(buys, sells, hedges, [], lotFxRates); showToast('Cleared settles.'); }} />
          <LotDetailModal lotId={selectedLot} onClose={() => setSelectedLot(null)} buys={buys} sells={sells} promptLegs={selectedLotPromptLegs} dashboardData={engineResult.dashboard} hedgeData={engineResult.hedge} />
          {isBulkPasteModalOpen && (<BulkPasteModal title="Bulk Paste Lot IDs" description="Paste column of Lot IDs" placeholder={'AL1\nAL1\nZN1'} onApply={lines => { const nh = [...hedges]; let idx = 0; for (let i = 0; i < nh.length && idx < lines.length; i++) { if (!nh[i].archived && !nh[i].mappedLot) { nh[i] = { ...nh[i], mappedLot: lines[idx].toUpperCase() }; idx++; } } setHedges(nh); saveToFirebase(buys, sells, nh, liveSettles, lotFxRates); }} onClose={() => setIsBulkPasteModalOpen(false)} />)}
          <ConfirmModal isOpen={confirmDialog.isOpen} title={confirmDialog.title} message={confirmDialog.message} confirmText="Confirm" isDestructive={true} onConfirm={confirmDialog.onConfirm} onClose={() => setConfirmDialog(prev => ({ ...prev, isOpen: false }))} />

          {editingPhysical && (
            <EditPhysicalModal 
              editing={editingPhysical} 
              onClose={() => setEditingPhysical(null)} 
              onSave={(updatedData) => {
                let newBuys = buys;
                let newSells = sells;
                if (editingPhysical.type === 'buy') {
                  newBuys = buys.map(b => b.id === updatedData.id ? updatedData : b);
                  setBuys(newBuys);
                } else {
                  newSells = sells.map(s => s.id === updatedData.id ? updatedData : s);
                  setSells(newSells);
                }
                saveToFirebase(newBuys, newSells, hedges, liveSettles, lotFxRates);
                setEditingPhysical(null);
                showToast("Updated successfully!");
              }}
            />
          )}

          {editingHedge && (
            <EditHedgeModal 
              editing={editingHedge} 
              onClose={() => setEditingHedge(null)} 
              onSave={(updatedData) => {
                const newHedges = hedges.map(h => h.id === updatedData.id ? updatedData : h);
                setHedges(newHedges);
                saveToFirebase(buys, sells, newHedges, liveSettles, lotFxRates);
                setEditingHedge(null);
                showToast("Trade updated!");
              }}
            />
          )}

          <AlertsDrawer isOpen={isAlertsDrawerOpen} onClose={() => setIsAlertsDrawerOpen(false)} alerts={engineResult.alerts} onSelectLot={setSelectedLot} onNavigateToPromptMatrix={promptDate => { setActiveTab('matrix'); setHighlightPrompt(promptDate); }} />
        </div>
      );
    }

    createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
