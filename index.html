  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo, useRef } from 'https://esm.sh/react@18.3.1';
    import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
    import {
      RefreshCw, Download, Printer, Trash2, Sparkles, AlertTriangle, HardDrive,
      Upload, CheckCircle2, Clock, TrendingDown, TrendingUp, ShieldAlert, FileText,
      ChevronDown, ChevronUp, ChevronRight, EyeOff, PanelRightOpen, Calendar,
      ArrowRight, Search, Filter, Layers, Info, X, Clipboard, Check, Zap,
      ArrowDown, AlertCircle, CheckCircle, HelpCircle, PlusCircle, Plus,
      ArrowUpDown, ExternalLink, LayoutDashboard, BarChart3, PackagePlus, Link2,
      Sun, Moon, Menu
    } from 'https://esm.sh/lucide-react@0.454.0?deps=react@18.3.1';

    const Papa = window.Papa;
    const XLSX = window.XLSX;

    // ==================== UTILS: dateAndMetal.ts ====================
    const LME_MT_PER_LOT = 25;

    function getLotMultiplier(exchange, metal) {
      const ex = norm(exchange);
      const m = shortMetal(metal);
      if (ex === 'LME') return 25;
      if (ex === 'MCX') {
        if (m === 'CU') return 2.5;
        if (m === 'AL') return 5;
        if (m === 'ZN') return 5;
        if (m === 'PB') return 5;
        return 5;
      }
      return 1;
    }

    const num = (v) => {
      if (v == null || v === '') return null;
      if (typeof v === 'string') {
        const clean = v.replace(/[,\s₹$]/g, '');
        if (clean === '' || clean === '-') return null;
        const n = Number(clean);
        return isNaN(n) ? null : n;
      }
      const n = Number(v);
      return isNaN(n) ? null : n;
    };

    const nz = (v) => num(v) || 0;

    const norm = (s) =>
      (s == null ? '' : String(s)).trim().toUpperCase().replace(/\s+/g, ' ');

    function canonicalMetal(m) {
      const u = norm(m);
      if (u === 'AL' || u === 'ALI' || u.includes('ALUM') || u.includes('AHD')) return 'ALUMINIUM';
      if (u === 'ZN' || u === 'ZNC' || u.includes('ZINC') || u.includes('ZSD')) return 'ZINC';
      if (u === 'CU' || u.includes('COPPER') || u.includes('CAD')) return 'COPPER';
      if (u === 'PB' || u.includes('LEAD') || u.includes('PBD')) return 'LEAD';
      return 'OTHER';
    }

    function shortMetal(m) {
      const c = canonicalMetal(m);
      if (c === 'ALUMINIUM') return 'AL';
      if (c === 'ZINC') return 'ZN';
      if (c === 'COPPER') return 'CU';
      if (c === 'LEAD') return 'PB';
      return norm(m) || 'AL';
    }

    function getDuty(metal) {
      const s = shortMetal(metal);
      if (s === 'ZN') return 5.25;
      if (s === 'AL') return 8.25;
      if (s === 'CU') return 5.0;
      if (s === 'PB') return 5.0;
      return 0;
    }

    function parsePromptString(str, fallbackYear = new Date().getFullYear()) {
      if (!str) return '';
      if (typeof str === 'number') {
        const ms = Math.round((str - 25569) * 86400 * 1000);
        const dt = new Date(ms);
        return isNaN(dt.getTime()) ? '' : dt.toISOString().slice(0, 10);
      }
      const clean = String(str).trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(clean)) return clean;

      const months = {
        jan: '01', feb: '02', mar: '03', apr: '04',
        may: '05', jun: '06', jul: '07', aug: '08',
        sep: '09', oct: '10', nov: '11', dec: '12'
      };

      // 1. Match DD-MMM-YY or DD/MMM/YYYY
      const m =
        clean.match(/^(\d{1,2})[-/\s]([A-Za-z]{3})[-/\s](\d{2,4})/) ||
        clean.match(/(\d{1,2})[-/\s]([A-Za-z]{3})[-/\s](\d{2,4})/);
      if (m) {
        const day = m[1].padStart(2, '0');
        const mon = months[m[2].toLowerCase()];
        let yr = m[3];
        if (mon) {
          if (yr.length === 2) yr = '20' + yr;
          return `${yr}-${mon}-${day}`;
        }
      }

      // 2. Match DD-MM-YYYY or DD/MM/YYYY (Indian Date Format)
      const dmy = clean.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})$/);
      if (dmy) {
        const day = dmy[1].padStart(2, '0');
        const mon = dmy[2].padStart(2, '0');
        let yr = dmy[3];
        if (yr.length === 2) yr = '20' + yr;
        if (Number(mon) >= 1 && Number(mon) <= 12) {
          return `${yr}-${mon}-${day}`;
        }
      }

      // 3. Match MCX ExpiryMonth formats: "OCT", "OCTOBER", "OCT-26", "OCT 2026", "26-OCT"
      const expMatch =
        clean.match(/^([A-Za-z]{3,9})(?:[-/\s']*(\d{2,4}))?$/) ||
        clean.match(/^(\d{2,4})[-/\s']*([A-Za-z]{3,9})$/);
      if (expMatch) {
        const isMonthFirst = isNaN(Number(expMatch[1]));
        const monRaw = (isMonthFirst ? expMatch[1] : expMatch[2]).slice(0, 3).toLowerCase();
        const yrRaw = isMonthFirst ? expMatch[2] : expMatch[1];
        const mon = months[monRaw];
        if (mon) {
          let yr = yrRaw ? (yrRaw.length === 2 ? Number('20' + yrRaw) : Number(yrRaw)) : Number(fallbackYear);
          const lastDay = new Date(Date.UTC(yr, Number(mon), 0)).getUTCDate();
          return `${yr}-${mon}-${String(lastDay).padStart(2, '0')}`;
        }
      }

      const dt = new Date(clean);
      return isNaN(dt.getTime()) ? '' : dt.toISOString().slice(0, 10);
    }

    const dkey = (d) => parsePromptString(d);

    const daysBetween = (fromDate, toDate) => {
      const f = new Date(fromDate);
      const t = new Date(toDate);
      f.setHours(0, 0, 0, 0);
      t.setHours(0, 0, 0, 0);
      return Math.round((t.getTime() - f.getTime()) / (1000 * 60 * 60 * 24));
    };

    const getDaysToExpiry = (promptStr, exchange, asOfDate = new Date()) => {
      const p = parsePromptString(promptStr);
      if (!p) return 999;

      let pDate = new Date(p + 'T00:00:00');

      if (norm(exchange) === 'LME') {
        pDate.setDate(pDate.getDate() - 2);
        const day = pDate.getDay();
        if (day === 6) pDate.setDate(pDate.getDate() - 1);
        if (day === 0) pDate.setDate(pDate.getDate() - 2);
      }

      return daysBetween(asOfDate, pDate);
    };

    const getTimelineBucket = (days) => {
      if (days <= 0) return 'T+0';
      if (days <= 3) return 'T+3';
      if (days <= 7) return '7D';
      if (days <= 30) return '30D';
      return '30D+';
    };

    const round = (n, p = 6) => Math.round(n * 10 ** p) / 10 ** p;
    const sum = (arr) => arr.reduce((a, b) => a + (b || 0), 0);

    const fmt = (n, d = 2) => {
      if (n == null || isNaN(n)) return '—';
      return Number(n).toLocaleString('en-IN', {
        minimumFractionDigits: d,
        maximumFractionDigits: d
      });
    };

    const fmtD = (d) => {
      if (!d) return '—';
      const clean = parsePromptString(d);
      return clean || '—';
    };

    const pnlClass = (n) => {
      if (n == null || isNaN(n) || Math.abs(n) < 0.0001) return 'text-slate-400';
      return n > 0 ? 'text-emerald-400' : 'text-rose-400';
    };

    // ==================== UTILS: engine.ts ====================
    function buildEngine(
      buys,
      sells,
      hedges,
      liveSettle,
      defaultFx = 84.2,
      lotFxMap = {},
      asOfDate = new Date()
    ) {
      // 1. Build Physical by Lot
      const buysByLot = {};
      buys.forEach(b => {
        const lot = String(b.lot || '').trim().toUpperCase();
        if (!lot) return;
        if (!buysByLot[lot]) {
          buysByLot[lot] = { lot, metal: canonicalMetal(b.metal), date: b.date || null, qty: 0, value: 0, usd: b.usd, parties: [], files: [] };
        }
        const q = nz(b.qty);
        const p = nz(b.landed);
        buysByLot[lot].qty += q;
        buysByLot[lot].value += q * p;
        if (b.usd && !buysByLot[lot].usd) buysByLot[lot].usd = b.usd;
        if (b.date && (!buysByLot[lot].date || b.date < buysByLot[lot].date)) {
          buysByLot[lot].date = b.date;
        }
        if (b.cat) buysByLot[lot].parties.push(b.cat);
        if (b.file) buysByLot[lot].files.push(b.file);
      });

      const sellsByLot = {};
      sells.forEach(s => {
        const lot = String(s.lot || '').trim().toUpperCase();
        if (!lot) return;
        if (!sellsByLot[lot]) {
          sellsByLot[lot] = { qty: 0, value: 0, parties: [] };
        }
        const q = nz(s.qty);
        const p = nz(s.price);
        sellsByLot[lot].qty += q;
        sellsByLot[lot].value += q * p;
        if (s.cat) sellsByLot[lot].parties.push(s.cat);
      });

      const mappedHedges = hedges.filter(h => !h.archived && String(h.mappedLot || '').trim() !== '');

      const allLotIds = new Set([
        ...Object.keys(buysByLot),
        ...Object.keys(sellsByLot),
        ...mappedHedges.map(h => String(h.mappedLot).trim().toUpperCase())
      ]);

      const physicalSummaries = Array.from(allLotIds).map(lot => {
        const b = buysByLot[lot] || {
          lot,
          metal: canonicalMetal(mappedHedges.find(h => h.mappedLot.toUpperCase() === lot)?.metal) || 'ALUMINIUM',
          date: null,
          qty: 0,
          value: 0,
          parties: [],
          files: []
        };
        const s = sellsByLot[lot] || { qty: 0, value: 0, parties: [] };

        const QtyB = b.qty;
        const QtyS = s.qty;
        const BuyP = QtyB > 0 ? b.value / QtyB : 0;
        const SellP = QtyS > 0 ? s.value / QtyS : 0;
        const InStock = QtyB - QtyS;
        const Realized = QtyS > 0 ? (SellP - BuyP) * QtyS : 0;
        const Unpriced = InStock;

        let Status;
        if (QtyB === 0 && QtyS === 0) Status = 'Hedge Only (No Physical)';
        else if (QtyS === 0 && QtyB > 0) Status = 'Open Stock (Unsold)';
        else if (QtyS < QtyB) Status = 'Open Stock (Partially Sold)';
        else if (QtyS === QtyB) Status = 'CLOSED';
        else Status = 'Over-Sold';

        const buyerNames = Array.from(new Set(b.parties.filter(Boolean)));
        const sellerNames = Array.from(new Set(s.parties.filter(Boolean)));

        return {
          lot,
          metal: b.metal,
          physStatus: Status,
          physBuyDate: b.date,
          physBuyQty: QtyB,
          physBuyPrice: BuyP,
          physSellQty: QtyS,
          physSellPrice: SellP,
          physInStockQty: InStock,
          physUnpricedQty: Unpriced,
          physRealizedPnL: Realized,
          buyerNames,
          sellerNames,
          buyerSearch: buyerNames.join(' ').toLowerCase(),
          sellerSearch: sellerNames.join(' ').toLowerCase(),
          hasMissingPdf: b.files.includes('No File') || (QtyB > 0 && b.files.length === 0)
        };
      });

      // 2. Build Live Settle Map
      const liveMap = {};
      liveSettle.forEach(l => {
        const m = canonicalMetal(l.metal);
        const e = norm(l.exchange);
        const d = dkey(l.prompt);
        if (!m || !e || !d) return;
        if (l.settle != null) {
          liveMap[`${m}|${e}|${d}`] = l.settle;
        }
      });

      // 3. Build Hedge Summaries with Per-Lot FX Rate
      const hedgeByLot = {};
      mappedHedges.forEach(h => {
        const lot = h.mappedLot.trim().toUpperCase();
        if (!hedgeByLot[lot]) hedgeByLot[lot] = [];
        hedgeByLot[lot].push(h);
      });

      const physMap = new Map(physicalSummaries.map(p => [p.lot, p]));

      const hedgeSummaries = Array.from(allLotIds).map(lot => {
        const lotTrades = hedgeByLot[lot] || [];
        const phys = physMap.get(lot);
        const metal = phys ? phys.metal : canonicalMetal(lotTrades[0]?.metal);

        const lotFx =
          lotFxMap[lot] ??
          buysByLot[lot]?.usd ??
          nz(lotTrades.find(t => norm(t.exch) === 'LME')?.fxRate) ??
          defaultFx ??
          84.2;

        const buildExchangeSection = (exch) => {
          const exTrades = lotTrades.filter(t => norm(t.exch) === exch);
          const isLME = exch === 'LME';

          const promptGroups = {};
          exTrades.forEach(t => {
            const pKey = dkey(t.prompt) || 'NO_PROMPT';
            if (!promptGroups[pKey]) promptGroups[pKey] = [];
            promptGroups[pKey].push(t);
          });

          const rawLegs = Object.entries(promptGroups).map(([promptKey, pTrades]) => {
            const buyQtyMT = sum(pTrades.map(t => nz(t.buyQty) * getLotMultiplier(t.exch || exch, t.metal || metal)));
            const sellQtyMT = sum(pTrades.map(t => nz(t.sellQty) * getLotMultiplier(t.exch || exch, t.metal || metal)));

            const buyVal = sum(pTrades.map(t => nz(t.buyQty) * getLotMultiplier(t.exch || exch, t.metal || metal) * nz(t.buyRate)));
            const sellVal = sum(pTrades.map(t => nz(t.sellQty) * getLotMultiplier(t.exch || exch, t.metal || metal) * nz(t.sellRate)));

            const avgBuyPrice = buyQtyMT > 0 ? buyVal / buyQtyMT : 0;
            const avgSellPrice = sellQtyMT > 0 ? sellVal / sellQtyMT : 0;

            const netQtyMT = buyQtyMT - sellQtyMT;
            const matchedQtyMT = Math.min(buyQtyMT, sellQtyMT);
            const openQtyMT = Math.abs(netQtyMT);

            const fx = isLME ? (lotFx || 84.2) : 1;
            const liveKey = `${metal}|${exch}|${promptKey}`;
            const settlePrice = liveMap[liveKey] ?? null;

            const isMCX = exch === 'MCX';
            const normPrice = (p) => {
              if (isMCX && p >= 10000) return p / 1000;
              return p;
            };

            const effBuyP = normPrice(avgBuyPrice);
            const effSellP = normPrice(avgSellPrice);
            const effSettleP = settlePrice != null ? normPrice(settlePrice) : null;
            const priceToInrFactor = isLME ? fx : 1000;

            const realizedPnL = matchedQtyMT > 0 ? (effSellP - effBuyP) * matchedQtyMT * priceToInrFactor : 0;

            let openMTM = 0;
            if (openQtyMT > 0 && effSettleP != null) {
              if (netQtyMT > 0) {
                openMTM = (effSettleP - effBuyP) * openQtyMT * priceToInrFactor;
              } else {
                openMTM = (effSellP - effSettleP) * openQtyMT * priceToInrFactor;
              }
            }

            const daysToExpiry = getDaysToExpiry(promptKey, exch, asOfDate);
            const timelineBucket = getTimelineBucket(daysToExpiry);
            const isOpen = Math.abs(netQtyMT) > 0.0001;

            const tradeDates = pTrades.map(t => t.date).filter(Boolean).sort();
            const firstTradeDate = tradeDates[0] || null;
            const lastTradeDate = tradeDates[tradeDates.length - 1] || null;

            return {
              prompt: promptKey,
              daysToExpiry,
              timelineBucket,
              buyQtyMT,
              sellQtyMT,
              netQtyMT,
              avgBuyPrice,
              avgSellPrice,
              settlePrice,
              hasSettle: settlePrice != null,
              matchedQtyMT,
              openQtyMT,
              realizedPnL,
              openMTM,
              isOpen,
              firstTradeDate,
              lastTradeDate
            };
          });

          rawLegs.sort((a, b) => {
            if (a.firstTradeDate && b.firstTradeDate && a.firstTradeDate !== b.firstTradeDate) {
              return a.firstTradeDate.localeCompare(b.firstTradeDate);
            }
            if (a.lastTradeDate && b.lastTradeDate && a.lastTradeDate !== b.lastTradeDate) {
              return a.lastTradeDate.localeCompare(b.lastTradeDate);
            }
            return a.prompt.localeCompare(b.prompt);
          });

          const promptLegs = rawLegs.map((leg, idx) => {
            if (leg.isOpen) {
              const dir = leg.netQtyMT < 0 ? 'Short' : 'Long';
              return {
                ...leg,
                isRolledOver: false,
                isClosed: false,
                status: 'OPEN',
                statusDetail: `Active Open ${dir} (${Math.abs(leg.netQtyMT).toFixed(2)} MT)`,
                rolledToPrompt: null
              };
            }

            const subsequentLegs = rawLegs.slice(idx + 1);
            const targetLeg =
              subsequentLegs.find(nextLeg => {
                if (!leg.lastTradeDate || !nextLeg.firstTradeDate) return true;
                return nextLeg.firstTradeDate >= leg.lastTradeDate || nextLeg.isOpen;
              }) || (subsequentLegs.length > 0 ? subsequentLegs[0] : null);

            if (targetLeg) {
              return {
                ...leg,
                isRolledOver: true,
                isClosed: false,
                status: 'ROLLED OVER',
                statusDetail: `Rolled over to ${targetLeg.prompt}`,
                rolledToPrompt: targetLeg.prompt
              };
            }

            return {
              ...leg,
              isRolledOver: false,
              isClosed: true,
              status: 'CLOSED',
              statusDetail: 'Closed — No subsequent position opened',
              rolledToPrompt: null
            };
          });

          const openLegs = promptLegs.filter(l => l.isOpen);
          const activePrompt = openLegs.length > 0 ? openLegs[openLegs.length - 1].prompt : (promptLegs[promptLegs.length - 1]?.prompt || null);
          const allPrompts = promptLegs.map(l => l.prompt);

          const totalBuyMT = sum(promptLegs.map(l => l.buyQtyMT));
          const totalSellMT = sum(promptLegs.map(l => l.sellQtyMT));
          const totalNetMT = sum(promptLegs.map(l => l.netQtyMT));
          const totalOpenActiveMT = sum(openLegs.map(l => Math.abs(l.netQtyMT)));

          const totalBuyVal = sum(promptLegs.map(l => l.avgBuyPrice * l.buyQtyMT));
          const totalSellVal = sum(promptLegs.map(l => l.avgSellPrice * l.sellQtyMT));
          const avgBuyP = totalBuyMT > 0 ? totalBuyVal / totalBuyMT : 0;
          const avgSellP = totalSellMT > 0 ? totalSellVal / totalSellMT : 0;

          const settles = promptLegs.map(l => l.settlePrice).filter(v => v != null);
          const settle = settles.length > 0 ? Math.max(...settles) : 0;

          const mtm = sum(promptLegs.map(l => l.openMTM));
          const realized = sum(promptLegs.map(l => l.realizedPnL));

          return {
            activePrompt,
            allPrompts,
            promptsCount: promptLegs.length,
            buyQty: totalBuyMT,
            sellQty: totalSellMT,
            avgBuyP,
            avgSellP,
            settle,
            netQty: totalNetMT,
            openActiveQty: totalOpenActiveMT,
            mtm,
            realized,
            promptLegs
          };
        };

        const lme = buildExchangeSection('LME');
        const mcx = buildExchangeSection('MCX');

        const hasRollover = lme.promptsCount > 1 || mcx.promptsCount > 1 ||
          lme.promptLegs.some(p => p.isRolledOver) || mcx.promptLegs.some(p => p.isRolledOver);

        const totalRealized = lme.realized + mcx.realized;
        const totalMTM = lme.mtm + mcx.mtm;
        const totalNetPosition = lme.netQty + mcx.netQty;

        const tradeDates = lotTrades.map(t => t.date).filter(Boolean).sort();
        const remark = Math.abs(totalNetPosition) < 0.0001 ? 'Hedge Squared Off' : 'Hedge Active';

        return {
          lot,
          metal,
          fxRate: lotFx,
          lme,
          mcx,
          hasRollover,
          totalRealized,
          totalMTM,
          totalNetPosition,
          firstTradeDate: tradeDates[0] || null,
          lastTradeDate: tradeDates[tradeDates.length - 1] || null,
          remark
        };
      }).filter(h => h.lme.buyQty > 0 || h.lme.sellQty > 0 || h.mcx.buyQty > 0 || h.mcx.sellQty > 0);

      const hedgeMap = new Map(hedgeSummaries.map(h => [h.lot, h]));

      // 4. Build Combined Dashboard Summaries
      const dashboardSummaries = physicalSummaries.map(p => {
        const h = hedgeMap.get(p.lot);

        const LN = h ? h.lme.netQty : 0;
        const MN = h ? h.mcx.netQty : 0;
        const LN_MTM = h ? h.lme.mtm : 0;
        const MN_MTM = h ? h.mcx.mtm : 0;
        const LN_Real = h ? h.lme.realized : 0;
        const MN_Real = h ? h.mcx.realized : 0;
        const TotalHReal = h ? h.totalRealized : 0;
        const TotalHMTM = LN_MTM + MN_MTM;
        const PhysReal = p.physRealizedPnL;
        const Naked = p.physInStockQty + LN + MN;

        let Instruction;
        if (Math.abs(Naked) < 0.0001 && LN !== 0) Instruction = '⚡ MOVE TO MCX';
        else if (Math.abs(Naked) < 0.0001 && MN !== 0) Instruction = '✓ FULLY HEDGED';
        else if (Naked > 0) Instruction = '⚠ UNDER-HEDGED';
        else if (Naked < 0) Instruction = '⚠ OVER-HEDGED';
        else Instruction = '● CLOSED';

        return {
          ...p,
          lmeActivePrompt: h ? h.lme.activePrompt : null,
          lmeNetQty: LN,
          lmeMTM: LN_MTM,
          lmeRealized: LN_Real,
          mcxActivePrompt: h ? h.mcx.activePrompt : null,
          mcxNetQty: MN,
          mcxMTM: MN_MTM,
          mcxRealized: MN_Real,
          nakedExposure: Naked,
          totalHedgeMTM: TotalHMTM,
          totalNetRealizedPnL: PhysReal + TotalHReal,
          instruction: Instruction,
          hasRollover: h ? h.hasRollover : false,
          lmePromptLegs: h ? h.lme.promptLegs : [],
          mcxPromptLegs: h ? h.mcx.promptLegs : []
        };
      });

      // 5. Build Dedicated Prompt Matrix & Expiries Grid
      const promptMatrixMap = {};

      hedgeSummaries.forEach(h => {
        const lotPhys = physMap.get(h.lot);
        const physInStock = lotPhys?.physInStockQty || 0;
        const physSold = lotPhys?.physSellQty || 0;
        const isPhysicalUnsold = physInStock > 0 && physSold === 0;

        const processLegs = (legs, exch) => {
          legs.forEach(leg => {
            if (!leg.prompt || leg.prompt === 'NO_PROMPT') return;
            const key = `${h.metal}|${exch}|${leg.prompt}`;
            if (!promptMatrixMap[key]) {
              promptMatrixMap[key] = {
                metal: h.metal,
                exchange: exch,
                prompt: leg.prompt,
                buyQtyMT: 0,
                sellQtyMT: 0,
                lots: new Map()
              };
            }
            promptMatrixMap[key].buyQtyMT += leg.buyQtyMT;
            promptMatrixMap[key].sellQtyMT += leg.sellQtyMT;

            const existingLot = promptMatrixMap[key].lots.get(h.lot);
            if (existingLot) {
              existingLot.netQtyMT += leg.netQtyMT;
            } else {
              promptMatrixMap[key].lots.set(h.lot, {
                lot: h.lot,
                netQtyMT: leg.netQtyMT,
                physStockMT: physInStock,
                physSoldMT: physSold,
                isPhysicalUnsold
              });
            }
          });
        };

        processLegs(h.lme.promptLegs, 'LME');
        processLegs(h.mcx.promptLegs, 'MCX');
      });

      const promptMatrix = Object.entries(promptMatrixMap).map(([key, data]) => {
        const netQtyMT = data.buyQtyMT - data.sellQtyMT;
        const daysToExpiry = getDaysToExpiry(data.prompt, data.exchange, asOfDate);
        const timelineBucket = getTimelineBucket(daysToExpiry);

        const liveKey = `${data.metal}|${data.exchange}|${data.prompt}`;
        const settlePrice = liveMap[liveKey] ?? null;

        const lotsList = Array.from(data.lots.values()).filter(l => Math.abs(l.netQtyMT) > 0.0001);

        let hasMismatch = false;
        let mismatchType = 'NONE';
        let mismatchReason = '';

        if (daysToExpiry < 0 && Math.abs(netQtyMT) > 0.0001) {
          hasMismatch = true;
          mismatchType = 'EXPIRED_OPEN';
          mismatchReason = `Prompt ${data.prompt} is ${Math.abs(daysToExpiry)} days overdue with ${round(Math.abs(netQtyMT), 2)} MT open position! Immediate rollover or settlement required.`;
        } else if ((timelineBucket === 'T+0' || timelineBucket === 'T+3') && Math.abs(netQtyMT) > 0.0001) {
          const unsoldLots = lotsList.filter(l => l.isPhysicalUnsold || l.physStockMT > 0);
          if (unsoldLots.length > 0 && data.exchange === 'LME') {
            hasMismatch = true;
            mismatchType = 'CASH_SQUEEZE';
            mismatchReason = `Cash Expiry Squeeze: Short hedge expires in ${daysToExpiry}d (${data.prompt}), while physical stock (${unsoldLots.map(l => `${l.lot}: ${l.physStockMT}MT`).join(', ')}) is unsold! Mandatory roll to 3M faces contango/backwardation spread risk.`;
          }
        }

        let totalOpenMTM = 0;
        let totalRealizedPnL = 0;
        hedgeSummaries.forEach(h => {
          const legL = h.lme.promptLegs.find(l => l.prompt === data.prompt && norm(h.metal) === norm(data.metal) && data.exchange === 'LME');
          if (legL) {
            totalOpenMTM += legL.openMTM;
            totalRealizedPnL += legL.realizedPnL;
          }
          const legM = h.mcx.promptLegs.find(l => l.prompt === data.prompt && norm(h.metal) === norm(data.metal) && data.exchange === 'MCX');
          if (legM) {
            totalOpenMTM += legM.openMTM;
            totalRealizedPnL += legM.realizedPnL;
          }
        });

        return {
          key,
          metal: data.metal,
          exchange: data.exchange,
          prompt: data.prompt,
          daysToExpiry,
          timelineBucket,
          buyQtyMT: data.buyQtyMT,
          sellQtyMT: data.sellQtyMT,
          netQtyMT,
          openLotsCount: lotsList.length,
          lots: lotsList,
          settlePrice,
          hasSettle: settlePrice != null,
          totalOpenMTM,
          totalRealizedPnL,
          hasMismatch,
          mismatchType,
          mismatchReason
        };
      });

      promptMatrix.sort((a, b) => {
        const aOpen = Math.abs(a.netQtyMT) > 0.0001;
        const bOpen = Math.abs(b.netQtyMT) > 0.0001;
        if (aOpen !== bOpen) return aOpen ? -1 : 1;
        return a.daysToExpiry - b.daysToExpiry;
      });

      // 6. Build Live Risk & Compliance Alerts
      const alerts = [];

      const unmappedCount = hedges.filter(h => !h.archived && !h.mappedLot).length;
      if (unmappedCount > 0) {
        alerts.push({
          id: 'unmapped-trades',
          type: 'hedge',
          severity: 'warn',
          lot: 'UNMAPPED',
          metal: 'ALL',
          msg: `${unmappedCount} uploaded broker hedge trade(s) are unmapped (no Assigned Lot ID)`,
          val: `${unmappedCount} trades`
        });
      }

      promptMatrix.filter(pm => pm.hasMismatch).forEach(pm => {
        alerts.push({
          id: `mismatch-${pm.key}`,
          type: 'mismatch',
          severity: 'danger',
          lot: pm.lots.map(l => l.lot).join(', ') || 'PROMPT',
          metal: pm.metal,
          promptDate: pm.prompt,
          msg: pm.mismatchReason || `Prompt mismatch on ${pm.exchange} ${pm.prompt}`,
          val: `${round(pm.netQtyMT, 2)} MT (${pm.daysToExpiry}d)`
        });
      });

      physicalSummaries.forEach(p => {
        const h = hedgeMap.get(p.lot);

        if (p.hasMissingPdf) {
          alerts.push({
            id: `pdf-${p.lot}`,
            type: 'agreement',
            severity: 'danger',
            lot: p.lot,
            metal: p.metal,
            msg: `Missing purchase contract / Agreement PDF for physical buy`,
            val: 'PDF Missing'
          });
        }

        if (h) {
          const physNet = p.physInStockQty;
          const hedgeNet = h.lme.netQty + h.mcx.netQty;
          if (Math.abs(physNet) > 0.001 && Math.abs(hedgeNet) > 0.001) {
            if (Math.sign(physNet) === Math.sign(hedgeNet)) {
              alerts.push({
                id: `dir-${p.lot}`,
                type: 'hedge',
                severity: 'danger',
                lot: p.lot,
                metal: p.metal,
                msg: `Hedge direction inverted: Physical is ${physNet > 0 ? 'LONG' : 'SHORT'} (${physNet} MT), but hedge is also ${hedgeNet > 0 ? 'BUY' : 'SELL'} (${hedgeNet} MT)!`,
                val: `${hedgeNet} MT`
              });
            }
          }
        }

        const naked = p.physInStockQty + (h ? h.lme.netQty + h.mcx.netQty : 0);
        if (Math.abs(naked) > 0.001) {
          alerts.push({
            id: `naked-${p.lot}`,
            type: 'naked',
            severity: 'warn',
            lot: p.lot,
            metal: p.metal,
            msg: `Naked exposure ${naked > 0 ? 'under-hedged' : 'over-hedged'} by ${round(Math.abs(naked), 2)} MT`,
            val: `${round(naked, 2)} MT`
          });
        }

        const totalPnL = p.physRealizedPnL + (h ? h.totalRealized : 0);
        if (totalPnL < -50000) {
          alerts.push({
            id: `loss-${p.lot}`,
            type: 'loss',
            severity: 'danger',
            lot: p.lot,
            metal: p.metal,
            msg: `Significant cumulative realized loss on this lot`,
            val: `₹${round(totalPnL, 0).toLocaleString()}`
          });
        }
      });

      return {
        physical: physicalSummaries,
        hedge: hedgeSummaries,
        dashboard: dashboardSummaries,
        promptMatrix,
        alerts
      };
    }

    function syncOpenPrompts(hedges, existingSettles) {
      const existingMap = new Map();
      existingSettles.forEach(s => {
        const k = `${shortMetal(s.metal)}|${norm(s.exchange)}|${dkey(s.prompt)}`;
        existingMap.set(k, s);
      });

      const openPromptsMap = new Map();

      hedges.forEach(h => {
        if (h.archived || !h.mappedLot) return;
        const prompt = dkey(h.prompt);
        if (!prompt) return;
        const exch = norm(h.exch) === 'MCX' ? 'MCX' : 'LME';
        const metal = shortMetal(h.metal);
        const mul = getLotMultiplier(exch, h.metal);
        const buyMT = nz(h.buyQty) * mul;
        const sellMT = nz(h.sellQty) * mul;
        const net = buyMT - sellMT;

        const key = `${metal}|${exch}|${prompt}`;
        if (!openPromptsMap.has(key)) {
          openPromptsMap.set(key, { metal, exchange: exch, prompt, netQty: 0 });
        }
        openPromptsMap.get(key).netQty += net;
      });

      let newPromptsAdded = 0;
      const resultSettles = [...existingSettles];

      openPromptsMap.forEach(op => {
        if (Math.abs(op.netQty) > 0.0001) {
          const key = `${op.metal}|${op.exchange}|${op.prompt}`;
          if (!existingMap.has(key)) {
            resultSettles.push({
              id: `settle-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
              metal: op.metal,
              exchange: op.exchange,
              prompt: op.prompt,
              settle: 0,
              updatedAt: new Date().toISOString()
            });
            newPromptsAdded++;
          }
        }
      });

      resultSettles.sort((a, b) => a.prompt.localeCompare(b.prompt));
      return { updatedSettles: resultSettles, newPromptsAdded };
    }

    // ==================== COMPONENT: MetalPicker.tsx ====================
    const MetalPicker = ({ currentMetal, onSelectMetal, counts }) => {

    // ==================== TAB 1: PromptMatrix.tsx ====================
    const PromptMatrix = ({
      items,

      const [timelineFilter, setTimelineFilter] = useState('ALL');

        if (currentMetal !== 'BOTH' && canonicalMetal(item.metal) !== currentMetal) return false;
        if (timelineFilter !== 'ALL' && item.timelineBucket !== timelineFilter) return false;
        if (exchangeFilter !== 'ALL' && item.exchange !== exchangeFilter) return false;
        if (onlyOpen && Math.abs(item.netQtyMT) < 0.0001) return false;
        if (onlyMismatches && !item.hasMismatch) return false;
        if (search) {
          const q = search.toLowerCase();
          const lotsStr = item.lots.map(l => l.lot).join(' ').toLowerCase();
          const hay = `${item.prompt} ${item.metal} ${item.exchange} ${lotsStr}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      const openItems = items.filter(i => Math.abs(i.netQtyMT) > 0.0001);
      const totalOpenNetMT = openItems.reduce((acc, i) => acc + i.netQtyMT, 0);
      const totalOpenMTM = openItems.reduce((acc, i) => acc + i.totalOpenMTM, 0);

      const t0Items = openItems.filter(i => i.timelineBucket === 'T+0');
      const t3Items = openItems.filter(i => i.timelineBucket === 'T+3');
      const d30Items = openItems.filter(i => i.timelineBucket === '30D');
      const cashSqueezeItems = openItems.filter(i => i.hasMismatch && i.mismatchType === 'CASH_SQUEEZE');

      const bucketBadge = (bucket, days) => {

            <span className="px-2 py-0.5 rounded text-[11px] font-bold bg-rose-500/20 text-rose-300 border border-rose-500/40 animate-pulse">

            <span className="px-2 py-0.5 rounded text-[11px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40">
              T+3 CASH ({days}d)

        if (bucket === '30D') {
          return (
            <span className="px-2 py-0.5 rounded text-[11px] font-bold bg-blue-500/20 text-blue-300 border border-blue-500/40">
              30 DAYS ({days}d)
            </span>

        }
        return (
          <span className="px-2 py-0.5 rounded text-[11px] font-bold bg-slate-800 text-slate-300 border border-slate-700">
            FORWARD ({days}d)

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3">

            <div

                t0Items.length > 0
                  ? 'bg-gradient-to-b from-rose-950/40 to-[#16223d] border-rose-500/40 hover:border-rose-400'

            >
              <div className="text-[11px] font-medium text-slate-400 uppercase tracking-wider flex items-center justify-between">

              </div>
              <div className="text-2xl font-bold mt-1 font-mono text-rose-300">
                {t0Items.reduce((acc, i) => acc + Math.abs(i.netQtyMT), 0).toFixed(1)} <span className="text-xs font-normal text-slate-400">MT</span>
              </div>
              <div className="text-[11px] text-slate-400 mt-1">{t0Items.length} prompt(s) due today</div>

            <div

              className={`border rounded-2xl p-4 shadow-lg cursor-pointer transition-all ${

                  ? 'bg-gradient-to-b from-amber-950/40 to-[#16223d] border-amber-500/50 hover:border-amber-400 ring-1 ring-amber-500/30'

            <div className="bg-gradient-to-b from-[#111c33] to-[#16223d] border border-[#1e2d4d] rounded-2xl p-4 shadow-lg">
              <div className="text-[11px] font-medium text-slate-400 uppercase tracking-wider">Book Open MTM</div>

              <div className="text-[11px] text-slate-400 mt-1 flex items-center justify-between">

          {cashSqueezeItems.length > 0 && (

                    <h4 className="text-base font-bold text-amber-200">
                      Cash-to-3M Prompt Expiry Mismatch Detected ({cashSqueezeItems.length} prompts affected)
                    </h4>

                      ACTION REQUIRED

                    You have active LME short hedges expiring in <strong>&le; 3 days (Cash window)</strong> while the underlying physical lots
                    are still <strong>unsold in stock</strong>. Roll these hedges forward to avoid backwardation squeeze losses.
                  </p>
                  <div className="mt-3 flex items-center gap-3 flex-wrap">
                    {cashSqueezeItems.map(item => (
                      <button

                        className="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 hover:bg-amber-400 text-slate-950 shadow-md transition-all cursor-pointer"
                      >

              >

                <span>Sync Open Prompts for MTM</span>

          <div className="bg-[#111c33] border border-[#1e2d4d] rounded-2xl shadow-xl overflow-hidden">

                <h3 className="text-sm font-bold text-slate-200 tracking-wide flex items-center gap-2">

                  <span>Prompt Date Expiry &amp; Rollover Matrix</span>
                  <span className="text-xs text-slate-400 font-normal">({filtered.length} prompt entries)</span>

              <table className="w-full text-xs text-left border-collapse">

                      <div>Today's Settle</div>

                      </div>

                <tbody className="divide-y divide-[#182543] font-mono">
                  {filtered.length === 0 ? (
                    <tr>
                      <td colSpan={11} className="py-12 text-center text-xs text-slate-400 font-sans">
                        No prompt dates matching the current filter criteria.
                      </td>
                    </tr>
                  ) : (

    const PhysicalEntry = ({ buys, sells, onAddBuy, onAddSell, onDeleteBuy, onDeleteSell }) => {
      const [buyLot, setBuyLot] = useState('');
      const [buyCat, setBuyCat] = useState('');
      const [buyMetal, setBuyMetal] = useState('AL');
      const [buyExch, setBuyExch] = useState('LME');
      const [buyDate, setBuyDate] = useState(new Date().toISOString().slice(0, 10));
      const [buyQty, setBuyQty] = useState('');
      const [buyCsp, setBuyCsp] = useState('');
      const [buyPrem, setBuyPrem] = useState('0');
      const [buyUsd, setBuyUsd] = useState('84.2');

      const [buyFileName, setBuyFileName] = useState('No File');
      const [buyFileData, setBuyFileData] = useState(null);

      const [sellLot, setSellLot] = useState('');
      const [sellCat, setSellCat] = useState('');
      const [sellDate, setSellDate] = useState(new Date().toISOString().slice(0, 10));
      const [sellQty, setSellQty] = useState('');
      const [sellPrice, setSellPrice] = useState('');

      const duty = getDuty(buyMetal);

      const calculateLanded = () => {
        const csp = parseFloat(buyCsp) || 0;
        if (buyExch === 'MCX') return csp;
        const prem = parseFloat(buyPrem) || 0;
        const usd = parseFloat(buyUsd) || 1;
        return (csp + prem) * usd * (1 + duty / 100);
      };

      const handleFileChange = (e) => {
        const file = e.target.files?.[0];
        if (file) {
          setBuyFileName(file.name);
          const reader = new FileReader();
          reader.onloadend = () => {
            setBuyFileData(reader.result);
          };
          reader.readAsDataURL(file);
        } else {
          setBuyFileName('No File');
          setBuyFileData(null);
        }
      };

      const handleSaveBuy = (e) => {
        e.preventDefault();
        if (!buyLot.trim()) return;
        const qty = parseFloat(buyQty) || 0;
        if (qty <= 0) return;
        const landed = calculateLanded();
        onAddBuy({
          id: `buy-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          lot: buyLot.trim().toUpperCase(),
          cat: buyCat.trim(),
          metal: buyMetal,
          exch: buyExch,
          date: buyDate,
          qty,
          csp: parseFloat(buyCsp) || 0,
          prem: parseFloat(buyPrem) || 0,
          usd: parseFloat(buyUsd) || 1,
          duty,
          landed,
          file: buyFileName,
          fileData: buyFileData
        });
        setBuyLot('');
        setBuyQty('');
        setBuyCsp('');
        setBuyFileName('No File');
        setBuyFileData(null);
      };

      const handleSaveSell = (e) => {
        e.preventDefault();
        if (!sellLot.trim()) return;
        const qty = parseFloat(sellQty) || 0;
        const price = parseFloat(sellPrice) || 0;
        if (qty <= 0 || price <= 0) return;
        onAddSell({
          id: `sell-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          lot: sellLot.trim().toUpperCase(),
          cat: sellCat.trim(),
          date: sellDate,
          qty,
          price
        });
        setSellLot('');
        setSellQty('');
        setSellPrice('');
      };

                    />
                  </div>

                </div>
                <button type="submit" className="w-full py-2.5 rounded-xl text-xs font-semibold bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-md cursor-pointer">
                  Save Physical Purchase Record
                </button>
              </form>

                    <div className="col-span-2">
                      <label className="block text-[11px] font-semibold uppercase text-slate-400 mb-1">Sell Price (₹ / MT) *</label>
                      <input type="number" step="any" placeholder="0.00" value={sellPrice} onChange={e => setSellPrice(e.target.value)} className="w-full bg-[#0b1220] border border-[#1e2d4d] rounded-xl px-3 py-2 text-xs text-slate-100 font-mono font-bold" required />
                    </div>
                  </div>
                  <button type="submit" className="w-full py-2.5 rounded-xl text-xs font-semibold bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-md cursor-pointer">
                    Save Physical Sale Record
                  </button>
                </form>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="bg-[#111c33] border border-[#1e2d4d] rounded-2xl shadow-xl overflow-hidden">
              <div className="px-5 py-3 border-b border-[#1e2d4d] bg-[#16223d]">
                <h4 className="text-xs font-bold uppercase text-slate-300">Physical Purchases Log ({buys.length})</h4>
              </div>
              <div className="overflow-x-auto max-h-80">
                <table className="w-full text-xs text-left">
                  <thead>
                    <tr className="bg-[#16223d] text-slate-400 text-[10.5px] uppercase font-semibold">
                      <th className="py-2.5 px-3">Lot ID</th>

                      <th className="py-2.5 px-2">Date</th>

                      <th className="py-2.5 px-2 text-right">Landed Price</th>
                      <th className="py-2.5 px-2 text-center">Doc</th>
                      <th className="py-2.5 px-3 text-center">Del</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-[#182543] font-mono">
                    {buys.map(b => (
                      <tr key={b.id} className="hover:bg-[#16223d]/50">
                        <td className="py-2 px-3 font-bold text-white">{b.lot}</td>
                        <td className="py-2 px-2 font-sans">{shortMetal(b.metal)}</td>
                        <td className="py-2 px-2 text-slate-400">{fmtD(b.date)}</td>
                        <td className="py-2 px-2 text-right">{fmt(b.qty, 2)}</td>
                        <td className="py-2 px-2 text-right">₹{fmt(b.landed, 2)}</td>
                        <td className="py-2 px-2 text-center">
                          {b.fileData ? (
                            <a href={b.fileData} target="_blank" rel="noopener noreferrer" title={`View ${b.file}`} className="text-emerald-400 hover:text-emerald-300">
                              <FileText className="w-3.5 h-3.5 inline" />
                            </a>
                          ) : (
                            <span title="No Document" className="text-slate-600"><FileText className="w-3.5 h-3.5 inline" /></span>
                          )}
                        </td>
                        <td className="py-2 px-3 text-center">
                          <button onClick={() => onDeleteBuy(b.id)} className="text-rose-400 hover:text-rose-300 p-1 cursor-pointer">
                            <Trash2 className="w-3.5 h-3.5" />
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

            <div className="bg-[#111c33] border border-[#1e2d4d] rounded-2xl shadow-xl overflow-hidden">
              <div className="px-5 py-3 border-b border-[#1e2d4d] bg-[#16223d]">
                <h4 className="text-xs font-bold uppercase text-slate-300">Physical Sales Log ({sells.length})</h4>
              </div>
              <div className="overflow-x-auto max-h-80">
                <table className="w-full text-xs text-left">
                  <thead>
                    <tr className="bg-[#16223d] text-slate-400 text-[10.5px] uppercase font-semibold">
                      <th className="py-2.5 px-3">Lot ID</th>
                      <th className="py-2.5 px-2">Buyer</th>
                      <th className="py-2.5 px-2">Date</th>
                      <th className="py-2.5 px-2 text-right">Sold Qty (MT)</th>
                      <th className="py-2.5 px-2 text-right">Sell Price</th>
                      <th className="py-2.5 px-3 text-center">Del</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-[#182543] font-mono">
                    {sells.map(s => (
                      <tr key={s.id} className="hover:bg-[#16223d]/50">
                        <td className="py-2 px-3 font-bold text-white">{s.lot}</td>
                        <td className="py-2 px-2 font-sans text-slate-300">{s.cat || '—'}</td>
                        <td className="py-2 px-2 text-slate-400">{fmtD(s.date)}</td>
                        <td className="py-2 px-2 text-right">{fmt(s.qty, 2)}</td>
                        <td className="py-2 px-2 text-right">₹{fmt(s.price, 2)}</td>
                        <td className="py-2 px-3 text-center">
                          <button onClick={() => onDeleteSell(s.id)} className="text-rose-400 hover:text-rose-300 p-1 cursor-pointer">
                            <Trash2 className="w-3.5 h-3.5" />
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // ==================== TAB 6: HedgeMapper.tsx ====================
    const HedgeMapper = ({
      hedges,
      liveSettles,
      onImportTrades,
      onAddHedgeTrade,
      onUpdateHedgeTrade,
      onDeleteHedgeTrade,
      onAddLiveSettle,
      onDeleteLiveSettle,
      onSyncOpenPrompts,
      onOpenBulkPasteModal,
      onClearMappedTrades,
      onRestoreArchivedTrades,
      onDeleteAllHedgeTrades,
      archivedCount
    }) => {
      const [tradeId, setTradeId] = useState('');
      const [exch, setExch] = useState('MCX');
      const [metal, setMetal] = useState('AL');
      const [broker, setBroker] = useState('MOTILAL');
      const [date, setDate] = useState(new Date().toISOString().slice(0, 10));
      const [prompt, setPrompt] = useState('');
      const [buyQty, setBuyQty] = useState('');
      const [buyRate, setBuyRate] = useState('');
      const [sellQty, setSellQty] = useState('');
      const [sellRate, setSellRate] = useState('');
      const [mappedLot, setMappedLot] = useState('');
      const [mcxDefaultSide, setMcxDefaultSide] = useState('SELL');

      const [liveMetal, setLiveMetal] = useState('AL');
      const [liveExch, setLiveExch] = useState('MCX');
      const [livePrompt, setLivePrompt] = useState('');
      const [liveSettle, setLiveSettle] = useState('');

      const [search, setSearch] = useState('');
      const [metalFilter, setMetalFilter] = useState('');
      const [exchFilter, setExchFilter] = useState('');
      const [brokerFilter, setBrokerFilter] = useState('');
      const [statusFilter, setStatusFilter] = useState('');
      const [monthFilter, setMonthFilter] = useState('');
      const [monthBasis, setMonthBasis] = useState('prompt'); // 'prompt' | 'trade'
      const [specificDateFilter, setSpecificDateFilter] = useState('');
      const [isUploadPanelOpen, setIsUploadPanelOpen] = useState(true);
      const [isManualEntryOpen, setIsManualEntryOpen] = useState(true);

      const MONTHS = [
        { num: '01', code: 'JAN', name: 'Jan' },
        { num: '02', code: 'FEB', name: 'Feb' },
        { num: '03', code: 'MAR', name: 'Mar' },
        { num: '04', code: 'APR', name: 'Apr' },
        { num: '05', code: 'MAY', name: 'May' },
        { num: '06', code: 'JUN', name: 'Jun' },
        { num: '07', code: 'JUL', name: 'Jul' },
        { num: '08', code: 'AUG', name: 'Aug' },
        { num: '09', code: 'SEP', name: 'Sep' },
        { num: '10', code: 'OCT', name: 'Oct' },
        { num: '11', code: 'NOV', name: 'Nov' },
        { num: '12', code: 'DEC', name: 'Dec' }
      ];

      const tradesPerMonth = useMemo(() => {
        const counts = {};
        hedges.forEach(h => {
          if (h.archived) return;
          const targetDate = monthBasis === 'prompt' ? h.prompt : h.date;
          const clean = dkey(targetDate);
          if (clean && clean.length >= 7) {
            const m = clean.slice(5, 7);
            counts[m] = (counts[m] || 0) + 1;
          }
        });
        return counts;
      }, [hedges, monthBasis]);

      const getCol = (row, ...names) => {
        const keys = Object.keys(row || {});
        for (const name of names) {
          const target = name.trim().toLowerCase().replace(/[\s_-]+/g, '');
          for (const k of keys) {
            const cleanKey = k.replace(/^[\uFEFF\s]+|[\s]+$/g, '').toLowerCase().replace(/[\s_-]+/g, '');
            if (cleanKey === target || cleanKey.includes(target)) return row[k];
          }
        }
        return '';
      };

      const handleFileUpload = (e) => {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;
        files.forEach(file => {
          if (/\.csv$/i.test(file.name)) {
            Papa.parse(file, {
              header: true,
              skipEmptyLines: true,
              complete: results => processParsedRows(results.data || [])
            });
          } else {
            const reader = new FileReader();
            reader.onload = ev => {
              try {
                const wb = XLSX.read(ev.target?.result, { type: 'array' });
                const ws = wb.Sheets[wb.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(ws, { defval: '' });
                processParsedRows(json);
              } catch (err) {
                console.error('Error parsing excel:', err);
              }
            };
            reader.readAsArrayBuffer(file);
          }
        });
        e.target.value = '';
      };

      const processParsedRows = (rows) => {
        const newTrades = [];
        const cleanNum = (v) => {
          if (typeof v === 'number') return v;
          return parseFloat(String(v || '0').replace(/[,\s₹$]/g, '')) || 0;
        };

        rows.forEach((row, idx) => {
          // Check if row matches user's MCX format: date | expirymonth | metal | lots | rate | broker
          const rawExpiryMonth = getCol(row, 'expirymonth', 'expiry month', 'expiry', 'contract month');
          const rawLots = getCol(row, 'lots', 'lot', 'no of lots', 'qty lots');
          const rawRate = getCol(row, 'rate', 'price', 'trade rate', 'mcx rate');
          const rawBroker = String(getCol(row, 'broker', 'broker name', 'member') || '').trim();
          const rawMetal = String(getCol(row, 'metal', 'commodity', 'symbol', 'product') || '').trim();
          const rawDate = getCol(row, 'date', 'trade date', 'tradedate', 'transaction date');
          const rawSide = String(getCol(row, 'side', 'buy/sell', 'buysell', 'type', 'action', 'b/s') || '').trim().toUpperCase();
          const rawLotId = String(getCol(row, 'mappedlot', 'lot id', 'lotid', 'physical lot', 'assigned lot') || '').trim().toUpperCase();

          const isMcxCustomFormat = (rawExpiryMonth !== '' || rawBroker !== '') && (rawLots !== '' || rawRate !== '');

          if (isMcxCustomFormat) {
            const tradeDate = parsePromptString(rawDate) || new Date().toISOString().slice(0, 10);
            const tradeYear = Number(tradeDate.slice(0, 4)) || new Date().getFullYear();
            const promptDate = parsePromptString(rawExpiryMonth, tradeYear) || tradeDate;

            const m = shortMetal(rawMetal || 'AL');
            const lotsVal = cleanNum(rawLots);
            const rateVal = cleanNum(rawRate); // Rs/kg
            if (lotsVal === 0 && rateVal === 0) return;

            let normBroker = rawBroker.toUpperCase();
            if (normBroker.includes('MOTILAL') || normBroker.includes('MOFSL') || normBroker.includes('MOSL')) normBroker = 'MOTILAL';
            else if (normBroker.includes('IIFL') || normBroker.includes('INDIA INFOLINE')) normBroker = 'IIFL';
            else if (!normBroker) normBroker = 'MCX';

            let isBuy = false;
            if (rawSide.startsWith('B')) {
              isBuy = true;
            } else if (rawSide.startsWith('S')) {
              isBuy = false;
            } else if (lotsVal < 0) {
              isBuy = false;
            } else {
              isBuy = mcxDefaultSide === 'BUY';
            }

            const absLots = Math.abs(lotsVal);
            const bQty = isBuy ? absLots : 0;
            const bRate = isBuy ? rateVal : 0;
            const sQty = !isBuy ? absLots : 0;
            const sRate = !isBuy ? rateVal : 0;

            const rawId = getCol(row, 'transaction id', 'trade id', 'order no');
            const tId = rawId
              ? String(rawId).trim()
              : `${normBroker.slice(0, 3)}-${tradeDate.replace(/-/g, '').slice(2)}-${idx + 1}`;

            newTrades.push({
              id: `h-mcx-${Date.now()}-${idx}-${Math.random().toString(36).slice(2, 6)}`,
              tradeId: tId,
              exch: 'MCX',
              broker: normBroker,
              metal: m,
              date: tradeDate,
              prompt: promptDate,
              expiryLabel: String(rawExpiryMonth).trim().toUpperCase(),
              buyQty: bQty,
              buyRate: bRate,
              sellQty: sQty,
              sellRate: sRate,
              mappedLot: rawLotId,
              archived: false
            });
            return;
          }

          // Fallback: Standard LME / Multi-column Broker Format
          const rawId = getCol(row, 'Transaction Id', 'Trade Id', 'Trade ID', 'Order No');
          if (!rawId && !rawMetal) return;
          const tId = String(rawId || `TRD-${Date.now()}-${idx}`).trim();
          const prod = String(getCol(row, 'Product', 'Symbol', 'Instrument', 'Metal') || '').toUpperCase();
          const desc = String(getCol(row, 'Product Description', 'Description', 'Contract') || '');
          const upperDesc = desc.toUpperCase();

          let m = shortMetal(prod || upperDesc || 'AL');

          let exchange = 'LME';
          if (upperDesc.includes('MCX') || prod.includes('MCX') || rawBroker.toUpperCase().includes('MOTILAL') || rawBroker.toUpperCase().includes('IIFL')) {
            exchange = 'MCX';
          }

          const tradeDate = parsePromptString(rawDate) || new Date().toISOString().slice(0, 10);
          let promptDate = parsePromptString(desc);
          if (!promptDate) {
            promptDate = parsePromptString(getCol(row, 'Prompt Date', 'Expiry Date', 'Prompt', 'ExpiryMonth'), Number(tradeDate.slice(0, 4)));
          }

          const bQty = cleanNum(getCol(row, 'Buys', 'Buy Qty', 'Buy Quantity', 'Buy Lots'));
          const bRate = cleanNum(getCol(row, 'Weighted Avg. Buy', 'Buy Rate', 'Buy Price', 'Avg Buy'));
          const sQty = cleanNum(getCol(row, 'Sells', 'Sell Qty', 'Sell Quantity', 'Sell Lots'));
          const sRate = cleanNum(getCol(row, 'Weighted Avg. Sell', 'Sell Rate', 'Sell Price', 'Avg Sell'));

          newTrades.push({
            id: `h-${Date.now()}-${idx}-${Math.random().toString(36).slice(2, 7)}`,
            tradeId: tId,
            exch: exchange,
            broker: rawBroker ? rawBroker.toUpperCase() : (exchange === 'MCX' ? 'MOTILAL' : 'LME'),
            metal: m,
            date: tradeDate,
            prompt: promptDate || tradeDate,
            buyQty: bQty,
            buyRate: bRate,
            sellQty: sQty,
            sellRate: sRate,
            mappedLot: rawLotId,
            archived: false
          });
        });

        if (newTrades.length > 0) onImportTrades(newTrades);
      };

      const handleDownloadMcxTemplate = () => {
        const sampleRows = [
          { date: '2026-10-15', expirymonth: 'OCT-26', metal: 'AL', lots: -5, rate: 242.50, broker: 'Motilal', side: 'SELL', mappedlot: 'AL1' },
          { date: '2026-10-16', expirymonth: 'NOV-26', metal: 'ZN', lots: -4, rate: 284.75, broker: 'IIFL', side: 'SELL', mappedlot: 'ZN1' },
          { date: '2026-10-18', expirymonth: 'NOV-26', metal: 'CU', lots: -8, rate: 852.40, broker: 'Motilal', side: 'SELL', mappedlot: 'CU1' }
        ];
        const ws = XLSX.utils.json_to_sheet(sampleRows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'MCX_Trades');
        XLSX.writeFile(wb, 'MCX_Hedge_Upload_Template.xlsx');
      };

      const handleAddManualTrade = (e) => {
        e.preventDefault();
        const tId = tradeId.trim() || `${exch === 'MCX' ? broker.slice(0, 3) : 'LME'}-${Date.now().toString().slice(-5)}`;
        const parsedPrompt = parsePromptString(prompt, Number(date.slice(0, 4))) || date;
        onAddHedgeTrade({
          id: `h-man-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          tradeId: tId,
          exch,
          broker: exch === 'MCX' ? broker : 'LME',
          metal,
          date,
          prompt: parsedPrompt,
          buyQty: parseFloat(buyQty) || 0,
          buyRate: parseFloat(buyRate) || 0,
          sellQty: parseFloat(sellQty) || 0,
          sellRate: parseFloat(sellRate) || 0,
          mappedLot: mappedLot.trim().toUpperCase(),
          archived: false
        });
        setTradeId('');
        setBuyQty('');
        setBuyRate('');
        setSellQty('');
        setSellRate('');
        setMappedLot('');
      };

      const handleAddSettle = (e) => {
        e.preventDefault();
        const p = parseFloat(liveSettle);
        if (!livePrompt || isNaN(p)) return;
        onAddLiveSettle(liveMetal, liveExch, livePrompt, p);
        setLiveSettle('');
      };

      const visibleTrades = hedges.filter(h => {
        if (h.archived) return false;
        if (metalFilter && shortMetal(h.metal) !== metalFilter) return false;
        if (exchFilter && h.exch !== exchFilter) return false;
        if (brokerFilter && (h.broker || '').toUpperCase() !== brokerFilter) return false;
        if (statusFilter === 'UNMAPPED' && h.mappedLot !== '') return false;
        if (statusFilter === 'MAPPED' && h.mappedLot === '') return false;

        const targetDate = monthBasis === 'prompt' ? h.prompt : h.date;
        const cleanTarget = dkey(targetDate);

        if (monthFilter) {
          if (!cleanTarget || cleanTarget.length < 7 || cleanTarget.slice(5, 7) !== monthFilter) return false;
        }
        if (specificDateFilter) {
          if (cleanTarget !== specificDateFilter) return false;
        }
        if (search) {
          const hay = `${h.tradeId} ${h.mappedLot} ${h.prompt || ''} ${h.date || ''} ${h.metal} ${h.broker || ''}`.toLowerCase();
          if (!hay.includes(search.toLowerCase())) return false;
        }
        return true;
      });

      const mappedCount = hedges.filter(h => h.mappedLot && !h.archived).length;

      return (
        <div className="space-y-4">
          <div className="bg-[#111c33]/90 border border-blue-500/25 rounded-2xl px-5 py-3 flex items-center justify-between gap-3 text-xs text-slate-300 flex-wrap shadow-lg">
            <div className="flex items-center gap-2 flex-wrap">
              <span className="px-2 py-0.5 rounded-md bg-blue-500/20 text-blue-300 font-bold text-[10.5px] uppercase border border-blue-500/30">
                Contract Multipliers
              </span>
              <span className="text-slate-300 text-xs">
                <strong>LME:</strong> 1 Lot = 25 MT ($/MT) &bull; <strong>MCX AL &amp; ZN:</strong> 1 Lot = 5 MT (₹/kg) &bull; <strong>MCX CU:</strong> 1 Lot = 2.5 MT (₹/kg) &bull; <strong>Brokers:</strong> Motilal / IIFL
              </span>
            </div>
            <div className="flex items-center gap-2">
              <button
                onClick={() => setIsUploadPanelOpen(prev => !prev)}
                className="text-[11px] font-medium text-slate-300 hover:text-white px-2.5 py-1 rounded-lg bg-[#16223d] border border-slate-700 cursor-pointer"
              >
                {isUploadPanelOpen ? 'Hide Upload & Settle Panels' : 'Show Upload & Settle Panels'}
              </button>
              <button
                onClick={() => setIsManualEntryOpen(prev => !prev)}
                className="text-[11px] font-medium px-2.5 py-1 rounded-lg border bg-blue-600 text-white border-blue-500 cursor-pointer flex items-center gap-1"
              >
                <Plus className="w-3 h-3" />
                <span>{isManualEntryOpen ? 'Hide Manual Entry' : '+ Manual Trade Entry'}</span>
              </button>
            </div>
          </div>

          {isUploadPanelOpen && (
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <div className="bg-gradient-to-b from-[#111c33] to-[#16223d] border border-[#1e2d4d] rounded-2xl p-5 shadow-xl space-y-3">
                <div className="flex items-center justify-between flex-wrap gap-2">
                  <h3 className="text-sm font-bold uppercase tracking-wider text-blue-400 flex items-center gap-2">
                    <Upload className="w-4 h-4" />
                    <span>Upload MCX / LME Broker Excel (.XLSX / .CSV)</span>
                  </h3>
                  <button
                    onClick={handleDownloadMcxTemplate}
                    className="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-[#16223d] hover:bg-[#1e2d4d] text-cyan-300 border border-cyan-500/30 cursor-pointer"
                  >
                    <Download className="w-3 h-3" />
                    <span>MCX Template</span>
                  </button>
                </div>

                <div className="p-2.5 rounded-xl bg-[#0b1220] border border-slate-800 text-[11px] text-slate-300 space-y-1.5">
                  <div className="flex items-center justify-between flex-wrap gap-2">
                    <span className="text-slate-400 font-semibold uppercase text-[10px]">Supported MCX Columns:</span>
                    <div className="flex items-center gap-1.5">
                      <span className="text-[10px] text-slate-400">Unsigned Lots Default:</span>
                      <button
                        type="button"
                        onClick={() => setMcxDefaultSide('SELL')}
                        className={`px-2 py-0.5 rounded text-[10px] font-bold cursor-pointer ${mcxDefaultSide === 'SELL' ? 'bg-rose-500/20 text-rose-300 border border-rose-500/40' : 'bg-slate-800 text-slate-400'}`}
                      >
                        SELL HEDGE
                      </button>
                      <button
                        type="button"
                        onClick={() => setMcxDefaultSide('BUY')}
                        className={`px-2 py-0.5 rounded text-[10px] font-bold cursor-pointer ${mcxDefaultSide === 'BUY' ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' : 'bg-slate-800 text-slate-400'}`}
                      >
                        BUY HEDGE
                      </button>
                    </div>
                  </div>
                  <div className="font-mono text-[11px] text-cyan-300 bg-[#111c33] px-2.5 py-1 rounded border border-[#1e2d4d]">
                    date &nbsp;|&nbsp; expirymonth &nbsp;|&nbsp; metal &nbsp;|&nbsp; lots &nbsp;|&nbsp; rate (Rs/kg) &nbsp;|&nbsp; broker (Motilal / IIFL)
                  </div>
                  <div className="text-[10.5px] text-slate-400">
                    Tip: Use negative lots (e.g. <code className="text-rose-300">-4</code>) for Short Sells and positive (e.g. <code className="text-emerald-300">+4</code>) for Buys, or add an optional <code className="text-slate-200">side</code> column.
                  </div>
                </div>

                <input
                  type="file"
                  accept=".csv,.xlsx,.xls"
                  multiple
                  onChange={handleFileUpload}
                  className="w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white cursor-pointer"
                />
              </div>

              <div className="bg-gradient-to-b from-[#111c33] to-[#16223d] border border-[#1e2d4d] rounded-2xl p-5 shadow-xl space-y-3">
                <div className="flex items-center justify-between flex-wrap gap-2">
                  <h3 className="text-sm font-bold uppercase tracking-wider text-emerald-400 flex items-center gap-2">

            <div className="border border-[#1e2d4d] rounded-xl overflow-x-auto max-h-[60vh] bg-[#0b1220]">

                    <th className="py-2.5 px-3">Trade ID</th>

    // ==================== MODALS ====================
    const RolloverModal = ({ item, onClose, onExecuteRollover }) => {
      if (!item) return null;
      const openNetMT = Math.abs(item.netQtyMT);
      const lotMultiplier = getLotMultiplier(item.exchange, item.metal);
      const openLots = openNetMT / lotMultiplier;
      const isShort = item.netQtyMT < 0;

      const currentDate = new Date(item.prompt + 'T00:00:00');
      const targetDateDefault = new Date(currentDate);
      targetDateDefault.setDate(targetDateDefault.getDate() + 35);

      const [newPromptDate, setNewPromptDate] = useState(targetDateDefault.toISOString().slice(0, 10));
      const [squareRate, setSquareRate] = useState(item.settlePrice || 2400);
      const [spread, setSpread] = useState(10);
      const [spreadType, setSpreadType] = useState('CONTANGO');
      const [assignedLot, setAssignedLot] = useState(item.lots[0]?.lot || '');

      const forwardRate = spreadType === 'CONTANGO'
        ? squareRate + (isShort ? spread : -spread)
        : squareRate - (isShort ? spread : -spread);

      const handleExecute = () => {
        if (!newPromptDate) return;
        const todayStr = new Date().toISOString().slice(0, 10);
        const rolloverIdBase = `ROLL-${Date.now().toString().slice(-5)}`;
        const closeTrade = {
          id: `roll-close-${Date.now()}-1`,
          tradeId: `${rolloverIdBase}-SQ`,
          exch: item.exchange,
          metal: shortMetal(item.metal),
          date: todayStr,
          prompt: item.prompt,
          buyQty: isShort ? openLots : 0,
          buyRate: isShort ? squareRate : 0,
          sellQty: isShort ? 0 : openLots,
          sellRate: isShort ? 0 : squareRate,
          mappedLot: assignedLot || item.lots[0]?.lot || '',
          archived: false
        };
        const forwardTrade = {
          id: `roll-open-${Date.now()}-2`,
          tradeId: `${rolloverIdBase}-FWD`,
          exch: item.exchange,
          metal: shortMetal(item.metal),
          date: todayStr,
          prompt: newPromptDate,
          buyQty: isShort ? 0 : openLots,
          buyRate: isShort ? 0 : forwardRate,
          sellQty: isShort ? openLots : 0,
          sellRate: isShort ? forwardRate : 0,
          mappedLot: assignedLot || item.lots[0]?.lot || '',
          archived: false
        };
        onExecuteRollover([closeTrade, forwardTrade]);
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm">
          <div className="bg-gradient-to-b from-[#111c33] to-[#16223d] border border-[#1e2d4d] rounded-2xl shadow-2xl w-full max-w-xl overflow-hidden">
            <div className="px-6 py-4 border-b border-[#1e2d4d] flex items-center justify-between bg-[#16223d]">
              <h2 className="text-base font-bold text-white">Prompt Rollover Simulator ({item.exchange} {shortMetal(item.metal)})</h2>
              <button onClick={onClose} className="text-slate-400 hover:text-white cursor-pointer"><X className="w-4 h-4" /></button>
            </div>
            <div className="p-6 space-y-4 text-xs">
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-[11px] font-semibold uppercase text-slate-400 mb-1">Target Forward Prompt Date</label>
                  <input type="date" value={newPromptDate} onChange={e => setNewPromptDate(e.target.value)} className="w-full bg-[#0b1220] border border-[#1e2d4d] rounded-xl px-3 py-2 text-xs text-slate-200 font-mono" />
                </div>
                <div>
