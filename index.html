    // ==================== MAIN APP ====================
    function App() {
      const fileInputRef = useRef(null);

      const [theme, setTheme] = useState(() => {
        try { return localStorage.getItem('hb_theme') || 'dark'; } catch { return 'dark'; }
      });

      useEffect(() => {
        try { localStorage.setItem('hb_theme', theme); } catch {}
        if (theme === 'light') document.documentElement.classList.add('light-theme');
        else document.documentElement.classList.remove('light-theme');
      }, [theme]);

      const [buys, setBuys] = useState(() => {
        try {
          const saved = localStorage.getItem('hb_buys');
          if (saved !== null) return JSON.parse(saved);
          return getSampleDemoData().buys;
        } catch { return getSampleDemoData().buys; }
      });

      const [sells, setSells] = useState(() => {
        try {
          const saved = localStorage.getItem('hb_sells');
          if (saved !== null) return JSON.parse(saved);
          return getSampleDemoData().sells;
        } catch { return getSampleDemoData().sells; }
      });

      const [hedges, setHedges] = useState(() => {
        try {
          const saved = localStorage.getItem('hb_hedges');
          if (saved !== null) return JSON.parse(saved);
          return getSampleDemoData().hedges;
        } catch { return getSampleDemoData().hedges; }
      });

      const [liveSettles, setLiveSettles] = useState(() => {
        try {
          const saved = localStorage.getItem('hb_live');
          if (saved !== null) return JSON.parse(saved);
          return getSampleDemoData().live;
        } catch { return getSampleDemoData().live; }
      });

      const [lotFxRates, setLotFxRates] = useState(() => {
        try {
          const saved = localStorage.getItem('hb_lot_fx');
          return saved ? JSON.parse(saved) : { AL1: 84.2, ZN1: 84.5 };
        } catch { return { AL1: 84.2, ZN1: 84.5 }; }
      });

      const defaultFx = 84.2;

      useEffect(() => { try { localStorage.setItem('hb_buys', JSON.stringify(buys)); } catch {} }, [buys]);
      useEffect(() => { try { localStorage.setItem('hb_sells', JSON.stringify(sells)); } catch {} }, [sells]);
      useEffect(() => { try { localStorage.setItem('hb_hedges', JSON.stringify(hedges)); } catch {} }, [hedges]);
      useEffect(() => { try { localStorage.setItem('hb_live', JSON.stringify(liveSettles)); } catch {} }, [liveSettles]);
      useEffect(() => { try { localStorage.setItem('hb_lot_fx', JSON.stringify(lotFxRates)); } catch {} }, [lotFxRates]);

      const [activeTab, setActiveTab] = useState('matrix');
      const [currentMetal, setCurrentMetal] = useState('BOTH');
      const [currentPeriod, setCurrentPeriod] = useState('ALL');
      const [periodBasis, setPeriodBasis] = useState('prompt'); // 'prompt' | 'trade'

      const [isSidebarOpen, setIsSidebarOpen] = useState(true);

      const [selectedLot, setSelectedLot] = useState(null);
      const [rolloverItem, setRolloverItem] = useState(null);
      const [isSyncModalOpen, setIsSyncModalOpen] = useState(false);
      const [isBulkPasteModalOpen, setIsBulkPasteModalOpen] = useState(false);
      const [highlightPrompt, setHighlightPrompt] = useState(undefined);
      const [toastMessage, setToastMessage] = useState(null);
      const [isAlertsDrawerOpen, setIsAlertsDrawerOpen] = useState(false);

      const [confirmDialog, setConfirmDialog] = useState({
        isOpen: false,
        title: '',
        message: '',
        onConfirm: () => {}
      });

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(prev => (prev === msg ? null : prev)), 3000);
      };

      const availableMonths = useMemo(() => {
        const months = new Set();
        buys.forEach(b => { const d = dkey(b.date); if (d.length >= 7) months.add(d.slice(0, 7)); });
        sells.forEach(s => { const d = dkey(s.date); if (d.length >= 7) months.add(d.slice(0, 7)); });
        hedges.forEach(h => {
          const target = periodBasis === 'trade' ? h.date : h.prompt;
          const d = dkey(target || h.date);
          if (d.length >= 7) months.add(d.slice(0, 7));
        });
        return Array.from(months).sort();
      }, [buys, sells, hedges, periodBasis]);

      const filteredBuys = useMemo(() => currentPeriod === 'ALL' ? buys : buys.filter(b => dkey(b.date).startsWith(currentPeriod)), [buys, currentPeriod]);
      const filteredSells = useMemo(() => currentPeriod === 'ALL' ? sells : sells.filter(s => dkey(s.date).startsWith(currentPeriod)), [sells, currentPeriod]);
      const filteredHedges = useMemo(() => {
        if (currentPeriod === 'ALL') return hedges;
        return hedges.filter(h => {
          const target = periodBasis === 'trade' ? h.date : h.prompt;
          return dkey(target).startsWith(currentPeriod);
        });
      }, [hedges, currentPeriod, periodBasis]);

      const engineResult = useMemo(() => {
        return buildEngine(filteredBuys, filteredSells, filteredHedges, liveSettles, defaultFx, lotFxRates);
      }, [filteredBuys, filteredSells, filteredHedges, liveSettles, defaultFx, lotFxRates]);

      const metalCounts = useMemo(() => ({
        ALUMINIUM: engineResult.physical.filter(r => canonicalMetal(r.metal) === 'ALUMINIUM').length,
        ZINC: engineResult.physical.filter(r => canonicalMetal(r.metal) === 'ZINC').length,
        COPPER: engineResult.physical.filter(r => canonicalMetal(r.metal) === 'COPPER').length,
        BOTH: engineResult.physical.length
      }), [engineResult.physical]);

      const filteredPhysical = useMemo(() => {
        if (currentMetal === 'BOTH') return engineResult.physical;
        return engineResult.physical.filter(r => canonicalMetal(r.metal) === currentMetal);
      }, [engineResult.physical, currentMetal]);

      const filteredHedge = useMemo(() => {
        if (currentMetal === 'BOTH') return engineResult.hedge;
        return engineResult.hedge.filter(r => canonicalMetal(r.metal) === currentMetal);
      }, [engineResult.hedge, currentMetal]);

      const filteredDashboard = useMemo(() => {
        if (currentMetal === 'BOTH') return engineResult.dashboard;
        return engineResult.dashboard.filter(r => canonicalMetal(r.metal) === currentMetal);
      }, [engineResult.dashboard, currentMetal]);

      const handleUpdateLotFx = (lotId, fx) => {
        setLotFxRates(prev => ({ ...prev, [lotId.trim().toUpperCase()]: fx }));
      };

      const handleSyncOpenPrompts = () => {
        const { updatedSettles, newPromptsAdded } = syncOpenPrompts(hedges, liveSettles);
        setLiveSettles(updatedSettles);
        setIsSyncModalOpen(true);
        showToast(newPromptsAdded > 0 ? `Synced ${newPromptsAdded} open prompt(s)!` : 'All open prompts synchronized.');
      };

      const handleUpdateSettlePrice = (metal, exchange, prompt, price) => {
        setLiveSettles(prev => {
          const m = shortMetal(metal);
          const idx = prev.findIndex(s => shortMetal(s.metal) === m && s.exchange === exchange && s.prompt === prompt);
          if (idx >= 0) {
            const next = [...prev];
            next[idx] = { ...next[idx], settle: price, updatedAt: new Date().toISOString() };
            return next;
          }
          return [...prev, { id: `settle-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`, metal: m, exchange, prompt, settle: price, updatedAt: new Date().toISOString() }];
        });
      };

      const handleBulkUpdateSettles = (newPrices) => {
        setLiveSettles(prev => {
          const next = [...prev];
          newPrices.forEach(np => {
            const m = shortMetal(np.metal);
            const idx = next.findIndex(s => shortMetal(s.metal) === m && s.exchange === np.exchange && s.prompt === np.prompt);
            if (idx >= 0) next[idx] = { ...next[idx], settle: np.price };
            else next.push({ id: `settle-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`, metal: m, exchange: np.exchange, prompt: np.prompt, settle: np.price });
          });
          return next;
        });
        showToast(`Updated settle prices for ${newPrices.length} prompt(s)!`);
      };

      const handleExecuteRollover = (newTrades) => {
        setHedges(prev => [...prev, ...newTrades]);
        showToast('Executed 2-leg rollover!');
      };

      const handleLoadDemoData = () => {
        const demo = getSampleDemoData();
        setBuys(demo.buys);
        setSells(demo.sells);
        setHedges(demo.hedges);
        setLiveSettles(demo.live);
        setLotFxRates({ AL1: 84.2, ZN1: 84.5 });
        showToast('Loaded demo data!');
      };

      const handleClearAllData = () => {
        setConfirmDialog({
          isOpen: true,
          title: 'Delete All Book Data?',
          message: 'Delete ALL physical buys, sales, broker hedge trades, and live settle prices?',
          confirmText: 'Yes, Delete Everything',
          isDestructive: true,
          onConfirm: () => {
            setBuys([]);
            setSells([]);
            setHedges([]);
            setLiveSettles([]);
            showToast('All book data cleared!');
          }
        });
      };

      const handleExportExcel = () => {
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(engineResult.promptMatrix), 'Prompt Matrix');
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(engineResult.dashboard), 'Dashboard');
        XLSX.writeFile(wb, `HedgeBook_${new Date().toISOString().slice(0, 10)}.xlsx`);
        showToast('Exported Excel!');
      };

      const handleBackupJSON = () => {
        const blob = new Blob([JSON.stringify({ buys, sells, hedges, liveSettles, lotFxRates }, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `HedgeBook_Backup_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        showToast('Downloaded JSON backup!');
      };

      const handleRestoreJSON = (file) => {
        const reader = new FileReader();
        reader.onload = ev => {
          try {
            const data = JSON.parse(ev.target?.result);
            if (Array.isArray(data.buys)) setBuys(data.buys);
            if (Array.isArray(data.sells)) setSells(data.sells);
            if (Array.isArray(data.hedges)) setHedges(data.hedges);
            if (Array.isArray(data.liveSettles)) setLiveSettles(data.liveSettles);
            if (data.lotFxRates) setLotFxRates(data.lotFxRates);
            showToast('Restored JSON backup!');
          } catch {
            showToast('Invalid JSON file.');
          }
        };
        reader.readAsText(file);
      };

      const selectedLotPromptLegs = useMemo(() => {
        if (!selectedLot) return [];
        const hedgeItem = engineResult.hedge.find(h => h.lot.toUpperCase() === selectedLot.toUpperCase());
        if (!hedgeItem) return [];
        return [...hedgeItem.lme.promptLegs, ...hedgeItem.mcx.promptLegs];
      }, [selectedLot, engineResult.hedge]);

      const tabs = [
        { id: 'matrix', label: 'Prompt Matrix', icon: Calendar },
        { id: 'dashboard', label: 'Combined Dashboard', icon: LayoutDashboard },
        { id: 'physical', label: 'Physical Analytics', icon: BarChart3 },
        { id: 'hedge', label: 'Hedge Analytics', icon: TrendingUp },
        { id: 'entry-phys', label: 'Physical Entry', icon: PackagePlus },
        { id: 'entry-hedge', label: 'Hedge Mapper & Upload', icon: Link2 },
      ];

      return (
        <div className="flex h-screen overflow-hidden bg-[#0b1220] text-[#e6ecf5] transition-colors">
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 flex items-center gap-2 px-4 py-2.5 rounded-xl bg-emerald-500 text-slate-950 text-xs font-bold shadow-2xl">
              <CheckCircle2 className="w-4 h-4" />
              <span>{toastMessage}</span>
            </div>
          )}

          {/* SIDEBAR */}
          <aside className={`bg-[#0f172a] border-r border-[#1e2d4d] flex flex-col transition-all duration-300 z-20 ${isSidebarOpen ? 'w-64' : 'w-0 overflow-hidden border-r-0'}`}>
            <div className="h-[53px] flex items-center px-4 border-b border-[#1e2d4d] whitespace-nowrap">
              <span className="font-bold text-sm tracking-wider uppercase text-slate-400">Menu</span>
            </div>
            <div className="flex-1 overflow-y-auto py-4 space-y-1 px-3">
              {tabs.map(tab => {
                const Icon = tab.icon;
                const isActive = activeTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all cursor-pointer whitespace-nowrap ${
                      isActive
                        ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-md'
                        : 'text-slate-400 hover:text-white hover:bg-[#16223d]'
                    }`}
                  >
                    <Icon className={`w-4 h-4 ${isActive ? 'text-white' : 'text-slate-500'}`} />
                    <span>{tab.label}</span>
                  </button>
                );
              })}
            </div>
          </aside>

          {/* MAIN CONTENT AREA */}
          <div className="flex-1 flex flex-col min-w-0">
            <Header
              theme={theme}
              onToggleTheme={() => setTheme(prev => (prev === 'dark' ? 'light' : 'dark'))}
              alertsCount={engineResult.alerts.length}
              onOpenAlertsDrawer={() => setIsAlertsDrawerOpen(true)}
              currentPeriod={currentPeriod}
              onPeriodChange={setCurrentPeriod}
              periodBasis={periodBasis}
              onPeriodBasisChange={setPeriodBasis}
              availableMonths={availableMonths}
              isSidebarOpen={isSidebarOpen}
              onToggleSidebar={() => setIsSidebarOpen(!isSidebarOpen)}
            />

            <main className="flex-1 overflow-y-auto p-6">
              <div className="max-w-[1600px] mx-auto space-y-5">
                <AlertsBanner
                  alerts={engineResult.alerts}
                  onSelectLot={setSelectedLot}
                  onNavigateToPromptMatrix={promptDate => {
                    setActiveTab('matrix');
                    setHighlightPrompt(promptDate);
                  }}
                  onOpenDrawer={() => setIsAlertsDrawerOpen(true)}
                />

                <div className="flex items-center justify-between gap-3 flex-wrap">
                  <MetalPicker
                    currentMetal={currentMetal}
                    onSelectMetal={setCurrentMetal}
                    counts={metalCounts}
                  />

                  <div className="flex items-center gap-1.5 p-1.5 bg-[#111c33] border border-[#1e2d4d] rounded-2xl shadow-sm mb-4">
                    <button onClick={handleSyncOpenPrompts} className="p-2 rounded-xl text-emerald-400 hover:bg-[#16223d] cursor-pointer" title="Sync Open Prompts">
                      <RefreshCw className="w-4 h-4" />
                    </button>
                    <button onClick={handleExportExcel} className="p-2 rounded-xl text-blue-400 hover:bg-[#16223d] cursor-pointer" title="Export Excel">
                      <Download className="w-4 h-4" />
                    </button>
                    <button onClick={handleBackupJSON} className="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-[#16223d] cursor-pointer" title="Backup JSON">
                      <HardDrive className="w-4 h-4" />
                    </button>
                    <input
                      type="file"
                      ref={fileInputRef}
                      accept=".json"
                      onChange={e => {
                        const f = e.target.files?.[0];
                        if (f) handleRestoreJSON(f);
                        e.target.value = '';
                      }}
                      className="hidden"
                    />
                    <button onClick={() => fileInputRef.current?.click()} className="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-[#16223d] cursor-pointer" title="Restore JSON Backup">
                      <Upload className="w-4 h-4" />
                    </button>
                    <button onClick={handleLoadDemoData} className="p-2 rounded-xl text-cyan-400 hover:bg-[#16223d] cursor-pointer" title="Load Demo Data">
                      <Sparkles className="w-4 h-4" />
                    </button>
                    <button onClick={handleClearAllData} className="p-2 rounded-xl text-rose-400 hover:bg-[#16223d] cursor-pointer" title="Clear All Data">
                      <Trash2 className="w-4 h-4" />
                    </button>
                  </div>
                </div>

                {activeTab === 'matrix' && (
                  <PromptMatrix
                    items={engineResult.promptMatrix}
                    currentMetal={currentMetal}
                    onSelectLot={setSelectedLot}
                    onOpenRolloverModal={setRolloverItem}
                    onSyncOpenPrompts={handleSyncOpenPrompts}
                    onUpdateSettlePrice={handleUpdateSettlePrice}
                    highlightPrompt={highlightPrompt}
                  />
                )}

                {activeTab === 'dashboard' && (
                  <CombinedDashboard
                    data={filteredDashboard}
                    onSelectLot={setSelectedLot}
                    onOpenPromptMatrix={promptDate => {
                      setActiveTab('matrix');
                      setHighlightPrompt(promptDate);
                    }}
                  />
                )}

                {activeTab === 'physical' && (
                  <PhysicalAnalytics
                    data={filteredPhysical}
                    onSelectLot={setSelectedLot}
                  />
                )}

                {activeTab === 'hedge' && (
                  <HedgeAnalytics
                    data={filteredHedge}
                    onSelectLot={setSelectedLot}
                    onUpdateLotFx={handleUpdateLotFx}
                  />
                )}

                {activeTab === 'entry-phys' && (
                  <PhysicalEntry
                    buys={buys}
                    sells={sells}
                    onAddBuy={buy => {
                      setBuys(prev => [...prev, buy]);
                      showToast(`Added Physical Buy for Lot ${buy.lot}`);
                    }}
                    onAddSell={sell => {
                      setSells(prev => [...prev, sell]);
                      showToast(`Added Physical Sale for Lot ${sell.lot}`);
                    }}
                    onDeleteBuy={id => setBuys(prev => prev.filter(b => b.id !== id))}
                    onDeleteSell={id => setSells(prev => prev.filter(s => s.id !== id))}
                  />
                )}

                {activeTab === 'entry-hedge' && (
                  <HedgeMapper
                    hedges={hedges}
                    liveSettles={liveSettles}
                    onImportTrades={newTrades => {
                      setHedges(prev => [...prev, ...newTrades]);
                      showToast(`Imported ${newTrades.length} broker trades!`);
                    }}
                    onAddHedgeTrade={t => {
                      setHedges(prev => [...prev, t]);
                      showToast(`Added trade ${t.tradeId}`);
                    }}
                    onUpdateHedgeTrade={(id, updates) => {
                      setHedges(prev => prev.map(h => (h.id === id ? { ...h, ...updates } : h)));
                    }}
                    onDeleteHedgeTrade={id => setHedges(prev => prev.filter(h => h.id !== id))}
                    onAddLiveSettle={(m, e, p, s) => {
                      handleUpdateSettlePrice(m, e, p, s);
                      showToast(`Saved settle price for ${m} ${e} (${p})`);
                    }}
                    onDeleteLiveSettle={id => setLiveSettles(prev => prev.filter(s => s.id !== id))}
                    onSyncOpenPrompts={handleSyncOpenPrompts}
                    onOpenBulkPasteModal={() => setIsBulkPasteModalOpen(true)}
                    onClearMappedTrades={() => {
                      setHedges(prev => prev.map(h => (h.mappedLot ? { ...h, archived: true } : h)));
                      showToast('Archived mapped trades.');
                    }}
                    onRestoreArchivedTrades={() => {
                      setHedges(prev => prev.map(h => ({ ...h, archived: false })));
                      showToast('Restored archived trades.');
                    }}
                    onDeleteAllHedgeTrades={() => {
                      setConfirmDialog({
                        isOpen: true,
                        title: 'Delete All Broker Trades?',
                        message: `Delete all ${hedges.length} broker hedge trades?`,
                        confirmText: 'Yes, Delete All',
                        isDestructive: true,
                        onConfirm: () => {
                          setHedges([]);
                          showToast('Deleted all broker trades.');
                        }
                      });
                    }}
                    archivedCount={hedges.filter(h => h.archived).length}
                  />
                )}
              </div>
            </main>
          </div>

          {rolloverItem && (
            <RolloverModal
              item={rolloverItem}
              onClose={() => setRolloverItem(null)}
              onExecuteRollover={handleExecuteRollover}
            />
          )}

          <SyncPromptsModal
            isOpen={isSyncModalOpen}
            onClose={() => setIsSyncModalOpen(false)}
            openPromptItems={engineResult.promptMatrix}
            onUpdateSettlePrice={handleUpdateSettlePrice}
            onBulkUpdateSettles={handleBulkUpdateSettles}
            onClearSettles={() => {
              setLiveSettles([]);
              showToast('Cleared settle prices.');
            }}
          />

          <LotDetailModal
            lotId={selectedLot}
            onClose={() => setSelectedLot(null)}
            buys={buys}
            sells={sells}
            promptLegs={selectedLotPromptLegs}
            dashboardData={engineResult.dashboard}
            hedgeData={engineResult.hedge}
          />

          {isBulkPasteModalOpen && (
            <BulkPasteModal
              title="Bulk Paste Lot IDs Column"
              description="Copy a vertical column of Lot IDs from Excel and paste below."
              placeholder={'AL1\nAL1\nZN1\n...'}
              onApply={lines => {
                setHedges(prev => {
                  const next = [...prev];
                  let idx = 0;
                  for (let i = 0; i < next.length && idx < lines.length; i++) {
                    if (!next[i].archived && !next[i].mappedLot) {
                      next[i] = { ...next[i], mappedLot: lines[idx].toUpperCase() };
                      idx++;
                    }
                  }
                  return next;
                });
                showToast('Applied bulk Lot IDs!');
              }}
              onClose={() => setIsBulkPasteModalOpen(false)}
            />
          )}

          <ConfirmModal
            isOpen={confirmDialog.isOpen}
            title={confirmDialog.title}
            message={confirmDialog.message}
            confirmText={confirmDialog.confirmText}
            isDestructive={confirmDialog.isDestructive}
            onConfirm={confirmDialog.onConfirm}
            onClose={() => setConfirmDialog(prev => ({ ...prev, isOpen: false }))}
          />

          <AlertsDrawer
            isOpen={isAlertsDrawerOpen}
            onClose={() => setIsAlertsDrawerOpen(false)}
            alerts={engineResult.alerts}
            onSelectLot={setSelectedLot}
            onNavigateToPromptMatrix={promptDate => {
              setActiveTab('matrix');
              setHighlightPrompt(promptDate);
            }}
          />
        </div>
      );
    }

    createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
